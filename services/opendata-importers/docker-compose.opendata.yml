x-importer-base: &importer-base
  build:
    context: .
    dockerfile: Dockerfile
  image: secondlayer-opendata-importer:latest
  network_mode: host          # use all host IPs for outbound
  restart: unless-stopped
  volumes:
    - ./_data:/data           # checkpoints persist
    - ${SSH_KEY_DIR:-${HOME}/.ssh}:/root/.ssh:ro

x-importer-env: &importer-env
  PROD_SSH_HOST: ${PROD_SSH_HOST:-18.192.189.254}
  PROD_SSH_USER: ${PROD_SSH_USER:-ubuntu}
  PROD_SSH_KEY: ${PROD_SSH_KEY:-/root/.ssh/secondlayer-prod}
  PG_CONTAINER: ${PG_CONTAINER:-secondlayer-postgres-prod}
  PG_USER: ${PG_USER:-secondlayer}
  PG_DB: ${PG_DB:-secondlayer_prod}
  WORKERS_PER_IP: ${WORKERS_PER_IP:-8}
  SLEEP_BETWEEN_RUNS: ${SLEEP_BETWEEN_RUNS:-3600}
  RUN_ONCE: ${RUN_ONCE:-0}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Optional: SOURCE_IPS=178.150.37.129,178.150.37.162,178.150.37.146

services:
  nl_rechtspraak:
    <<: *importer-base
    container_name: opendata-nl_rechtspraak
    command: ["importers.nl_rechtspraak"]
    environment:
      <<: *importer-env
      WALK_DAYS: ${RECHTSPRAAK_WALK_DAYS:-30}
      BACKFILL_DAYS: ${BACKFILL_DAYS:-0}

  nl_dnb:
    <<: *importer-base
    container_name: opendata-nl_dnb
    command: ["importers.nl_dnb"]
    environment: *importer-env

  nl_afm:
    <<: *importer-base
    container_name: opendata-nl_afm
    command: ["importers.nl_afm"]
    environment: *importer-env

  ie_central_bank:
    <<: *importer-base
    container_name: opendata-ie_central_bank
    command: ["importers.ie_central_bank"]
    environment: *importer-env

  ch_finma:
    <<: *importer-base
    container_name: opendata-ch_finma
    command: ["importers.ch_finma"]
    environment:
      <<: *importer-env
      WORKERS_PER_IP: "2"

  eu_echr:
    <<: *importer-base
    container_name: opendata-eu_echr
    command: ["importers.eu_echr"]
    environment:
      <<: *importer-env
      WORKERS_PER_IP: "2"
      ECHR_MAX_RECORDS: ${ECHR_MAX_RECORDS:-10000}

  ch_seco:
    <<: *importer-base
    container_name: opendata-ch_seco
    command: ["importers.ch_seco"]
    environment: *importer-env

  ch_kantonsblatt:
    <<: *importer-base
    container_name: opendata-ch_kantonsblatt
    command: ["importers.ch_kantonsblatt"]
    environment:
      <<: *importer-env
      WORKERS_PER_IP: "2"
      MAX_PAGES_PER_RUBRIC: ${KB_MAX_PAGES:-100}
      BACKFILL_DAYS: ${KB_BACKFILL_DAYS:-365}

  ch_entscheidsuche:
    <<: *importer-base
    container_name: opendata-ch_entscheidsuche
    command: ["importers.ch_entscheidsuche"]
    environment:
      <<: *importer-env
      WORKERS_PER_IP: "2"
      MAX_DOCS_PER_SPIDER: ${ES_MAX_DOCS:-10000}
      SPIDERS: ${ES_SPIDERS:-}

  ch_fedlex:
    <<: *importer-base
    container_name: opendata-ch_fedlex
    command: ["importers.ch_fedlex"]
    environment:
      <<: *importer-env
      MAX_ACTS: ${FEDLEX_MAX_ACTS:-500}

  spain_consejo_estado:
    <<: *importer-base
    container_name: opendata-spain_consejo_estado
    command: ["importers.spain_consejo_estado"]
    environment:
      <<: *importer-env
      WORKERS_PER_IP: "2"
      CE_MAX_PER_YEAR: ${CE_MAX_PER_YEAR:-1500}
      CE_YEARS: ${CE_YEARS:-}

  spain_boe_sumarios:
    <<: *importer-base
    container_name: opendata-spain_boe_sumarios
    command: ["importers.spain_boe_sumarios"]
    environment:
      <<: *importer-env
      WORKERS_PER_IP: "2"
      BOE_BACKFILL_DAYS: ${BOE_BACKFILL_DAYS:-90}
      BOE_MAX_DAYS: ${BOE_MAX_DAYS:-90}

  spain_contratos:
    <<: *importer-base
    container_name: opendata-spain_contratos
    command: ["importers.spain_contratos"]
    environment:
      <<: *importer-env
      WORKERS_PER_IP: "2"
      CONTRATOS_MAX_PAGES: ${CONTRATOS_MAX_PAGES:-200}
      CONTRATOS_SOURCES: ${CONTRATOS_SOURCES:-federal,ccaa,local}

  spain_congreso:
    <<: *importer-base
    container_name: opendata-spain_congreso
    command: ["importers.spain_congreso"]
    environment:
      <<: *importer-env
      WORKERS_PER_IP: "2"
      CONGRESO_CURRENT_LEG: ${CONGRESO_CURRENT_LEG:-15}
