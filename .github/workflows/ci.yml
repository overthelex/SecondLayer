name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build-shared:
    name: Build shared package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=packages/shared
      - uses: actions/upload-artifact@v4
        with:
          name: shared-dist
          path: packages/shared/dist
          retention-days: 1

  lint-and-build:
    name: ${{ matrix.workspace }}
    needs: build-shared
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: mcp_backend
            has_lint: true
          - workspace: mcp_rada
            has_lint: true
          - workspace: mcp_openreyestr
            has_lint: true
          - workspace: lexwebapp
            has_lint: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: packages/shared/dist

      - name: Lint
        if: matrix.has_lint
        run: npm run lint --workspace=${{ matrix.workspace }}

      - name: Build
        run: npm run build --workspace=${{ matrix.workspace }}

  test:
    name: Test ${{ matrix.workspace }}
    needs: build-shared
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: mcp_backend
            test_cmd: npx jest --no-cache --passWithNoTests
          - workspace: mcp_rada
            test_cmd: npx jest --no-cache --passWithNoTests
          - workspace: mcp_openreyestr
            test_cmd: npx jest --no-cache --passWithNoTests
          - workspace: lexwebapp
            test_cmd: npx vitest run --passWithNoTests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: shared-dist
          path: packages/shared/dist

      - name: Build workspace
        run: npm run build --workspace=${{ matrix.workspace }}

      - name: Test
        working-directory: ${{ matrix.workspace }}
        run: ${{ matrix.test_cmd }}
        env:
          NODE_ENV: test
