##############################################################################
# Pipeline 2: Stage CI/CD
# - Runs on self-hosted runner (stage server: gate.lexapp.co.ua)
# - Builds and tests all changed services in stage Docker environment
# - Deploys ONLY changed services to production
# - Triggered on merge to main
##############################################################################
name: 'CI/CD: Stage Build → Prod Deploy'

on:
  push:
    branches: [main]

concurrency:
  group: deploy-stage-to-prod
  cancel-in-progress: false

jobs:
  # ─── Step 1: Detect what changed ─────────────────────────────────────
  detect-changes:
    name: Detect Changes
    runs-on: [self-hosted, stage]
    outputs:
      shared: ${{ steps.changes.outputs.shared }}
      backend: ${{ steps.changes.outputs.backend }}
      rada: ${{ steps.changes.outputs.rada }}
      openreyestr: ${{ steps.changes.outputs.openreyestr }}
      frontend: ${{ steps.changes.outputs.frontend }}
      deployment: ${{ steps.changes.outputs.deployment }}
      any_backend: ${{ steps.changes.outputs.any_backend }}
      services_to_build: ${{ steps.changes.outputs.services_to_build }}
      services_to_deploy: ${{ steps.changes.outputs.services_to_deploy }}
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        uses: ./.github/actions/detect-changes

      - name: Check if any services need deploy
        id: check
        run: |
          SERVICES='${{ steps.changes.outputs.services_to_build }}'
          if [ "$SERVICES" = '[]' ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No services changed — skipping build/test/deploy"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  # ─── Step 2: Build & test on stage environment ──────────────────────
  build-and-test:
    name: Build & Test on Stage
    runs-on: [self-hosted, stage]
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    env:
      BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend }}
      RADA_CHANGED: ${{ needs.detect-changes.outputs.rada }}
      OPENREYESTR_CHANGED: ${{ needs.detect-changes.outputs.openreyestr }}
      FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build shared package
        run: cd packages/shared && npm ci && npm run build

      - name: Test backend
        if: needs.detect-changes.outputs.backend == 'true'
        run: |
          cd mcp_backend && npm ci && npm run build
          npm test
        env:
          NODE_ENV: test

      - name: Test RADA
        if: needs.detect-changes.outputs.rada == 'true'
        run: |
          cd mcp_rada && npm ci && npm run build
          npm test
        env:
          NODE_ENV: test

      - name: Test OpenReyestr
        if: needs.detect-changes.outputs.openreyestr == 'true'
        run: |
          cd mcp_openreyestr && npm ci && npm run build
          npm test
        env:
          NODE_ENV: test

      - name: Test frontend
        if: needs.detect-changes.outputs.frontend == 'true'
        run: |
          cd lexwebapp && npm ci
          npm test
          npm run build

  # ─── Step 3: Deploy to stage & integration test ─────────────────────
  stage-deploy-and-test:
    name: Deploy to Stage & Integration Test
    runs-on: [self-hosted, stage]
    needs: [detect-changes, build-and-test]
    if: |
      always() &&
      needs.build-and-test.result == 'success'
    env:
      BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend }}
      RADA_CHANGED: ${{ needs.detect-changes.outputs.rada }}
      OPENREYESTR_CHANGED: ${{ needs.detect-changes.outputs.openreyestr }}
      FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Build dist for changed services
        run: |
          npm --prefix packages/shared install && npm --prefix packages/shared run build

          [ "$BACKEND_CHANGED" = "true" ] && \
            npm --prefix mcp_backend install && npm --prefix mcp_backend run build || true
          [ "$RADA_CHANGED" = "true" ] && \
            npm --prefix mcp_rada install && npm --prefix mcp_rada run build || true
          [ "$OPENREYESTR_CHANGED" = "true" ] && \
            npm --prefix mcp_openreyestr install && npm --prefix mcp_openreyestr run build || true

      - name: Build & restart changed stage services
        working-directory: deployment
        run: |
          DC="docker compose -f docker-compose.stage.yml --env-file .env.stage"

          STOP="" BUILD="" START=""

          if [ "$BACKEND_CHANGED" = "true" ]; then
            STOP="$STOP app-stage document-service-stage"
            BUILD="$BUILD app-stage document-service-stage migrate-stage"
            START="$START app-stage document-service-stage"
          fi
          if [ "$RADA_CHANGED" = "true" ]; then
            STOP="$STOP rada-mcp-app-stage"
            BUILD="$BUILD rada-mcp-app-stage rada-db-init-stage rada-migrate-stage"
            START="$START rada-mcp-app-stage"
          fi
          if [ "$OPENREYESTR_CHANGED" = "true" ]; then
            STOP="$STOP app-openreyestr-stage"
            BUILD="$BUILD app-openreyestr-stage migrate-openreyestr-stage"
            START="$START app-openreyestr-stage"
          fi
          if [ "$FRONTEND_CHANGED" = "true" ]; then
            STOP="$STOP lexwebapp-stage"
            BUILD="$BUILD lexwebapp-stage"
            START="$START lexwebapp-stage"
          fi

          [ -n "$STOP" ] && $DC stop $STOP 2>/dev/null || true
          [ -n "$STOP" ] && $DC rm -f $STOP 2>/dev/null || true
          [ -n "$BUILD" ] && $DC build $BUILD

          [ "$BACKEND_CHANGED" = "true" ] && { $DC up migrate-stage || true; }
          [ "$RADA_CHANGED" = "true" ] && { $DC up rada-db-init-stage || true; $DC up rada-migrate-stage || true; }
          [ "$OPENREYESTR_CHANGED" = "true" ] && { $DC up migrate-openreyestr-stage || true; }

          [ -n "$START" ] && $DC up -d $START

          $DC restart nginx-stage
          docker image prune -f

      - name: Wait for stage services
        run: sleep 20

      - name: Stage health checks
        run: |
          FAILED=false
          check_health() {
            local name=$1 url=$2
            for i in 1 2 3; do
              if curl -sf --max-time 10 "$url" > /dev/null; then
                echo "$name: OK"
                return 0
              fi
              sleep 5
            done
            echo "::error::$name health check failed on stage"
            FAILED=true
          }

          [ "$BACKEND_CHANGED" = "true" ] && check_health "Backend" "http://localhost:3004/health"
          [ "$RADA_CHANGED" = "true" ] && check_health "RADA" "http://localhost:3001/health"
          [ "$OPENREYESTR_CHANGED" = "true" ] && check_health "OpenReyestr" "http://localhost:3005/health"

          check_health "Stage (public)" "https://stage.legal.org.ua/health"

          if [ "$FAILED" = "true" ]; then exit 1; fi

  # ─── Step 4: Deploy to production ───────────────────────────────────
  deploy-prod:
    name: Deploy to Production
    runs-on: [self-hosted, stage]
    needs: [detect-changes, stage-deploy-and-test]
    if: |
      always() &&
      needs.stage-deploy-and-test.result == 'success'
    environment: production
    env:
      PROD_SERVER: '18.192.189.254'
      PROD_USER: 'ubuntu'
      BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend }}
      RADA_CHANGED: ${{ needs.detect-changes.outputs.rada }}
      OPENREYESTR_CHANGED: ${{ needs.detect-changes.outputs.openreyestr }}
      FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy changed services to prod
        env:
          PROD_SSH_KEY_PATH: ${{ secrets.PROD_SSH_KEY_PATH }}
        run: |
          SSH_CMD="ssh -i $PROD_SSH_KEY_PATH -o StrictHostKeyChecking=no ${PROD_USER}@${PROD_SERVER}"
          REMOTE_REPO="/home/${PROD_USER}/SecondLayer"

          echo "=== Deploying to production (from stage) ==="

          # Pull latest code
          $SSH_CMD "git -C ${REMOTE_REPO} fetch origin main && git -C ${REMOTE_REPO} reset --hard origin/main"

          # Build dist on prod
          $SSH_CMD "cd ${REMOTE_REPO} && npm --prefix packages/shared install && npm --prefix packages/shared run build"

          [ "$BACKEND_CHANGED" = "true" ] && \
            $SSH_CMD "cd ${REMOTE_REPO} && npm --prefix mcp_backend install && npm --prefix mcp_backend run build"
          [ "$RADA_CHANGED" = "true" ] && \
            $SSH_CMD "cd ${REMOTE_REPO} && npm --prefix mcp_rada install && npm --prefix mcp_rada run build"
          [ "$OPENREYESTR_CHANGED" = "true" ] && \
            $SSH_CMD "cd ${REMOTE_REPO} && npm --prefix mcp_openreyestr install && npm --prefix mcp_openreyestr run build"

          # Selective stop/build/migrate/start
          $SSH_CMD bash << DEPLOY_SCRIPT
            set -e
            cd ${REMOTE_REPO}/deployment
            DC="docker compose -f docker-compose.prod.yml --env-file .env.prod"

            STOP="" BUILD="" START=""

            if [ "${BACKEND_CHANGED}" = "true" ]; then
              STOP="\$STOP app-prod document-service-prod"
              BUILD="\$BUILD app-prod document-service-prod migrate-prod"
              START="\$START app-prod document-service-prod"
            fi
            if [ "${RADA_CHANGED}" = "true" ]; then
              STOP="\$STOP rada-mcp-app-prod"
              BUILD="\$BUILD rada-mcp-app-prod rada-db-init-prod rada-migrate-prod"
              START="\$START rada-mcp-app-prod"
            fi
            if [ "${OPENREYESTR_CHANGED}" = "true" ]; then
              STOP="\$STOP app-openreyestr-prod"
              BUILD="\$BUILD app-openreyestr-prod migrate-openreyestr-prod"
              START="\$START app-openreyestr-prod"
            fi
            if [ "${FRONTEND_CHANGED}" = "true" ]; then
              STOP="\$STOP lexwebapp-prod"
              BUILD="\$BUILD lexwebapp-prod"
              START="\$START lexwebapp-prod"
            fi

            [ -n "\$STOP" ] && \$DC stop \$STOP 2>/dev/null || true
            [ -n "\$STOP" ] && \$DC rm -f \$STOP 2>/dev/null || true
            [ -n "\$BUILD" ] && \$DC build \$BUILD

            [ "${BACKEND_CHANGED}" = "true" ] && \$DC up migrate-prod || true
            [ "${RADA_CHANGED}" = "true" ] && { \$DC up rada-db-init-prod || true; \$DC up rada-migrate-prod || true; }
            [ "${OPENREYESTR_CHANGED}" = "true" ] && \$DC up migrate-openreyestr-prod || true

            [ -n "\$START" ] && \$DC up -d \$START

            \$DC restart nginx-prod
            docker image prune -f
          DEPLOY_SCRIPT

      - name: Prod health check
        env:
          PROD_SSH_KEY_PATH: ${{ secrets.PROD_SSH_KEY_PATH }}
        run: |
          SSH_CMD="ssh -i $PROD_SSH_KEY_PATH -o StrictHostKeyChecking=no ${PROD_USER}@${PROD_SERVER}"
          sleep 15

          for i in 1 2 3 4 5; do
            if $SSH_CMD "curl -sf --max-time 10 http://localhost:3007/health"; then
              echo "Production backend: healthy"
              break
            fi
            [ $i -eq 5 ] && echo "::error::Production health check failed" && exit 1
            sleep 10
          done

          for i in 1 2 3; do
            if curl -sf --max-time 15 "https://legal.org.ua/health"; then
              echo "Production (public): healthy"
              break
            fi
            [ $i -eq 3 ] && echo "::warning::Public health check timed out — may be Cloudflare cache"
            sleep 5
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          SERVICES_TO_DEPLOY: ${{ needs.detect-changes.outputs.services_to_deploy }}
        run: |
          # Determine next version based on conventional commits
          LAST_TAG=$(git tag -l "v*" --sort=-version:refname | head -1)

          if [ -z "$LAST_TAG" ]; then
            # First release ever
            NEXT_VERSION="v1.0.0"
            COMMITS=$(git log --oneline --no-merges -50)
          else
            COMMITS=$(git log "${LAST_TAG}..HEAD" --oneline --no-merges)

            # Parse current version
            CURRENT="${LAST_TAG#v}"
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)

            # Determine bump type from commit messages
            if echo "$COMMITS" | grep -qiE "^[a-f0-9]+ (feat|refactor)!:|BREAKING CHANGE"; then
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
            elif echo "$COMMITS" | grep -qiE "^[a-f0-9]+ feat(\(|:)"; then
              MINOR=$((MINOR + 1)); PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
            NEXT_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          # Build changelog grouped by type
          FEATURES=$(echo "$COMMITS" | grep -iE "^[a-f0-9]+ feat(\(|:)" | sed 's/^[a-f0-9]* /- /' || true)
          FIXES=$(echo "$COMMITS" | grep -iE "^[a-f0-9]+ fix(\(|:)" | sed 's/^[a-f0-9]* /- /' || true)
          OTHER=$(echo "$COMMITS" | grep -viE "^[a-f0-9]+ (feat|fix)(\(|:)" | grep -v "^$" | sed 's/^[a-f0-9]* /- /' || true)

          # Build release body
          BODY="## Deployed Services\n"
          BODY="${BODY}\n\`${SERVICES_TO_DEPLOY}\`\n"

          if [ -n "$FEATURES" ]; then
            BODY="${BODY}\n## Features\n${FEATURES}\n"
          fi
          if [ -n "$FIXES" ]; then
            BODY="${BODY}\n## Fixes\n${FIXES}\n"
          fi
          if [ -n "$OTHER" ]; then
            BODY="${BODY}\n## Other\n${OTHER}\n"
          fi

          BODY="${BODY}\n---\n**Commit:** ${GITHUB_SHA:0:7} | **Runner:** stage"

          echo "Creating release $NEXT_VERSION"

          # Create tag and release
          git tag "$NEXT_VERSION"
          git push origin "$NEXT_VERSION"

          printf "%b" "$BODY" | gh release create "$NEXT_VERSION" \
            --title "$NEXT_VERSION" \
            --notes-file - \
            --latest
