##############################################################################
# EDRSR Daily Sync: data.gov.ua → prod PostgreSQL
# - Runs on the prod self-hosted runner (prod-deploy); downloads current year ZIP
#   from data.gov.ua directly on the prod host, then imports into the local
#   secondlayer-postgres-prod container via docker exec (no SSH round-trip).
# - Imports new records incrementally (NOT EXISTS dedup on partitioned table)
# - Runs daily at 4:00 AM Kyiv time (1:00 AM UTC)
# - Can also be triggered manually with year parameter
##############################################################################
name: 'Cron: EDRSR Sync from data.gov.ua'

on:
  schedule:
    # 01:00 UTC = 04:00 Kyiv (EET+3 summer / EET+2 winter)
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to sync (default: current year)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: edrsr-sync
  cancel-in-progress: false

jobs:
  sync-edrsr:
    name: Sync EDRSR ${{ inputs.year || 'current year' }}
    runs-on: [self-hosted, prod-deploy]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run incremental sync
        env:
          PG_DOCKER_CONTAINER: secondlayer-postgres-prod
        run: |
          YEAR="${{ inputs.year || '' }}"
          if [ -n "$YEAR" ]; then
            ./scripts/edrsr/sync-edrsr-incremental.sh "$YEAR"
          else
            ./scripts/edrsr/sync-edrsr-incremental.sh
          fi

      - name: Check sync result
        if: always()
        run: |
          YEAR="${{ inputs.year }}"
          [ -z "$YEAR" ] && YEAR="$(date +%Y)"
          if [ -f "/tmp/edrsr_sync_${YEAR}.log" ]; then
            echo "=== Sync Log ==="
            cat "/tmp/edrsr_sync_${YEAR}.log"
          fi
