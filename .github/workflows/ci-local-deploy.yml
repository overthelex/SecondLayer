##############################################################################
# Pipeline: Local CI/CD
# - Runs on self-hosted runner (local.legal.org.ua)
# - Builds and tests all changed services in local Docker environment
# - Deploys changed services to local environment for integration testing
# - Triggered on merge to main
##############################################################################
name: 'CI/CD: Local Build & Test'

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: ci-local-build-test
  cancel-in-progress: false

jobs:
  # ─── Step 1: Detect what changed ─────────────────────────────────────
  detect-changes:
    name: Detect Changes
    runs-on: [self-hosted, local]
    outputs:
      shared: ${{ steps.changes.outputs.shared }}
      backend: ${{ steps.changes.outputs.backend }}
      rada: ${{ steps.changes.outputs.rada }}
      openreyestr: ${{ steps.changes.outputs.openreyestr }}
      frontend: ${{ steps.changes.outputs.frontend }}
      deployment: ${{ steps.changes.outputs.deployment }}
      any_backend: ${{ steps.changes.outputs.any_backend }}
      services_to_build: ${{ steps.changes.outputs.services_to_build }}
      services_to_deploy: ${{ steps.changes.outputs.services_to_deploy }}
      monitoring: ${{ steps.changes.outputs.monitoring }}
      platform: ${{ steps.changes.outputs.platform }}
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        uses: ./.github/actions/detect-changes

      - name: Check if any services need deploy
        id: check
        run: |
          SERVICES='${{ steps.changes.outputs.services_to_build }}'
          MONITORING='${{ steps.changes.outputs.monitoring }}'
          if [ "$SERVICES" = '[]' ] && [ "$MONITORING" != "true" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No services changed — skipping build/test/deploy"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  # ─── Step 2: Build & test on local environment ─────────────────────
  build-and-test:
    name: Build & Test on Local
    runs-on: [self-hosted, local]
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    env:
      BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend }}
      RADA_CHANGED: ${{ needs.detect-changes.outputs.rada }}
      OPENREYESTR_CHANGED: ${{ needs.detect-changes.outputs.openreyestr }}
      FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
      PLATFORM_CHANGED: ${{ needs.detect-changes.outputs.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure native build tools
        run: |
          if ! command -v make &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq build-essential python3
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Build shared package
        run: cd packages/shared && npm install --legacy-peer-deps && npm run build

      # Backend/RADA/OpenReyestr integration tests require running infrastructure (DB, Redis, MinIO).
      # CI runs TypeScript compilation + unit tests (mocked, no infra needed).
      - name: Overlay proprietary source
        if: needs.detect-changes.outputs.backend == 'true'
        run: |
          CORE_TMP=$(mktemp -d)
          gh repo clone overthelex/secondlayer-core "$CORE_TMP" -- --depth 1
          cp -f "$CORE_TMP"/src/services/* mcp_backend/src/services/
          cp -rf "$CORE_TMP"/src/prompts/* mcp_backend/src/prompts/
          rm -rf "$CORE_TMP"

      - name: Build backend
        if: needs.detect-changes.outputs.backend == 'true'
        run: |
          cd mcp_backend && npm install && npm run build

      - name: Unit test backend
        if: needs.detect-changes.outputs.backend == 'true'
        run: |
          cd mcp_backend && npx jest --no-cache --forceExit \
            src/controllers/__tests__/ \
            src/middleware/__tests__/ \
            src/adapters/__tests__/ \
            src/services/__tests__/

      - name: Build RADA
        if: needs.detect-changes.outputs.rada == 'true'
        run: cd mcp_rada && npm install && npm run build

      - name: Build OpenReyestr
        if: needs.detect-changes.outputs.openreyestr == 'true'
        run: cd mcp_openreyestr && npm install && npm run build

      - name: Install frontend deps
        if: needs.detect-changes.outputs.frontend == 'true'
        run: cd lexwebapp && npm install --legacy-peer-deps

      - name: Test frontend
        if: needs.detect-changes.outputs.frontend == 'true'
        run: |
          cd lexwebapp
          npm test 2>&1 | tee /tmp/vitest-output.txt || true
          # Check actual test results from stdout — worker OOM at teardown is not a test failure
          if grep -q "Tests.*failed" /tmp/vitest-output.txt; then
            echo "::error::Some tests failed"
            exit 1
          elif grep -q "Test Files.*passed" /tmp/vitest-output.txt; then
            echo "All tests passed (worker teardown issues ignored)"
          else
            echo "::error::Could not determine test results"
            exit 1
          fi
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Build frontend
        if: needs.detect-changes.outputs.frontend == 'true'
        run: cd lexwebapp && npm run build
        env:
          VITE_API_URL: https://local.legal.org.ua
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Build platform
        if: needs.detect-changes.outputs.platform == 'true'
        run: cd platform && npm install --legacy-peer-deps && npm run build

  # ─── Step 2b: Self-heal build failures with Claude Code ─────────────
  self-heal-build:
    name: Self-Heal Build Failures
    runs-on: [self-hosted, local]
    needs: [detect-changes, build-and-test]
    if: |
      always() &&
      needs.build-and-test.result == 'failure'
    env:
      CLAUDE_CODE_USE_BEDROCK: '1'
      CLAUDE_CODE_BEDROCK_MODEL: eu.anthropic.claude-sonnet-4-6
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: eu-central-1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Guard against infinite loops
        id: guard
        run: |
          # Check last 5 commits for autofix pattern (not just the last one)
          AUTOFIX_COUNT=$(git log -5 --format='%s' | grep -c '\[ci-autofix\]' || true)
          if [ "$AUTOFIX_COUNT" -ge 1 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Found $AUTOFIX_COUNT autofix commit(s) in last 5 — skipping to prevent loop"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch build error logs
        if: steps.guard.outputs.skip == 'false'
        id: errors
        run: |
          RUN_ID="${{ github.run_id }}"
          gh run view "$RUN_ID" --log-failed 2>&1 | tail -100 > /tmp/ci-errors.log
          echo "Captured $(wc -l < /tmp/ci-errors.log) lines of error logs"

      - name: Claude Code — diagnose and fix
        if: steps.guard.outputs.skip == 'false'
        id: claude-fix
        continue-on-error: true
        run: |
          BRANCH_NAME="ci-autofix/$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}"
          git checkout -b "$BRANCH_NAME"

          cat > /tmp/ci-prompt.txt <<'PROMPT_END'
          The CI/CD build-and-test job failed. The error logs are in /tmp/ci-errors.log — read that file first.

          Your task:
          1. Read /tmp/ci-errors.log to understand the failure
          2. Determine if this is a build error (TypeScript compilation) or a test failure
          3. Analyze the errors and identify the root cause
          4. Fix the code — edit the minimal set of files needed
          5. If it's a test failure:
             - Read the failing test file AND the source file it tests
             - Determine if the test is wrong (outdated assertions) or the source code has a bug
             - Fix whichever is actually incorrect
             - Run the specific test to verify: npx jest --no-cache <test-file> --forceExit
          6. If it's a build error:
             - Fix the TypeScript errors
             - Run npm run build in the affected service to verify
          7. Stage ONLY the files you changed and commit with message: "fix: [ci-autofix] <description>"
          8. Do NOT push — the pipeline will handle pushing and PR creation

          Rules:
          - Do NOT blindly change test expectations — understand WHY the test fails first
          - Do NOT modify CI workflow files
          - Do NOT install new dependencies unless absolutely necessary
          - Do NOT run git push
          - If the error is in environment config (missing env vars, wrong URLs), skip — it's not a code fix
          - If you cannot fix the issue, create a GitHub issue describing the problem
          PROMPT_END

          npx -y @anthropic-ai/claude-code@latest \
            -p "$(cat /tmp/ci-prompt.txt)" \
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep" \
            --max-turns 25
        timeout-minutes: 10

      - name: Check if fix was produced
        if: steps.guard.outputs.skip == 'false'
        id: check-fix
        run: |
          CURRENT_BRANCH=$(git branch --show-current)
          if git log --oneline "main..$CURRENT_BRANCH" 2>/dev/null | grep -q .; then
            echo "has_fix=true" >> "$GITHUB_OUTPUT"
            echo "branch=$CURRENT_BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "has_fix=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Claude Code did not produce a fix"
          fi

      - name: Create issue if no fix produced
        if: steps.guard.outputs.skip == 'false' && steps.check-fix.outputs.has_fix == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "CI build failure needs manual fix ($(date +%Y-%m-%d))" \
            --body "$(cat <<EOF
          ## CI build failure — auto-fix failed

          The self-heal agent could not produce a code fix for this build failure.

          **Failed run:** $RUN_URL
          **Commit:** ${GITHUB_SHA:0:7}

          Please investigate manually.
          EOF
          )" \
            --label "bug,ci"

      - name: Push branch and create PR
        if: steps.guard.outputs.skip == 'false' && steps.check-fix.outputs.has_fix == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BRANCH="${{ steps.check-fix.outputs.branch }}"
          git push origin "$BRANCH"

          gh pr create \
            --title "fix: [ci-autofix] Auto-fix for build failure" \
            --body "$(cat <<EOF
          ## Auto-generated fix

          Claude Code analyzed the CI build failure and produced this fix automatically.

          **Source run:** $RUN_URL

          > Review carefully before merging — this is an automated fix.

          🤖 Generated with [Claude Code](https://claude.com/claude-code)
          EOF
          )" \
            --base main \
            --head "$BRANCH"

  # ─── Step 3: Deploy to local & integration test ─────────────────────
  local-deploy-and-test:
    name: Deploy to Local & Integration Test
    runs-on: [self-hosted, local]
    needs: [detect-changes, build-and-test]
    if: |
      always() &&
      needs.build-and-test.result == 'success'
    env:
      BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend }}
      RADA_CHANGED: ${{ needs.detect-changes.outputs.rada }}
      OPENREYESTR_CHANGED: ${{ needs.detect-changes.outputs.openreyestr }}
      FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
      PLATFORM_CHANGED: ${{ needs.detect-changes.outputs.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure native build tools
        run: |
          if ! command -v make &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq build-essential python3
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Build dist for changed services
        run: |
          npm --prefix packages/shared install && npm --prefix packages/shared run build

          if [ "$BACKEND_CHANGED" = "true" ]; then
            CORE_TMP=$(mktemp -d)
            gh repo clone overthelex/secondlayer-core "$CORE_TMP" -- --depth 1
            cp -f "$CORE_TMP"/src/services/* mcp_backend/src/services/
            cp -rf "$CORE_TMP"/src/prompts/* mcp_backend/src/prompts/
            rm -rf "$CORE_TMP"
            npm --prefix mcp_backend install && npm --prefix mcp_backend run build
          fi
          if [ "$RADA_CHANGED" = "true" ]; then
            npm --prefix mcp_rada install && npm --prefix mcp_rada run build
          fi
          if [ "$OPENREYESTR_CHANGED" = "true" ]; then
            npm --prefix mcp_openreyestr install && npm --prefix mcp_openreyestr run build
          fi

      - name: Link env files from main repo
        run: |
          ln -sf /home/vovkes/SecondLayer/deployment/.env.local deployment/.env.local
          ln -sf /home/vovkes/SecondLayer/deployment/.env.prod deployment/.env.prod 2>/dev/null || true

      - name: Safety check — prod containers untouched
        run: |
          # Verify prod nginx and backend are running before we touch local env
          for c in nginx-prod secondlayer-app-prod-green secondlayer-app-prod-blue; do
            STATUS=$(docker inspect --format='{{.State.Status}}' "$c" 2>/dev/null || echo "absent")
            if [ "$STATUS" = "running" ]; then
              echo "✓ Prod container $c is running"
            fi
          done
          NGINX_STARTED=$(docker inspect --format='{{.State.StartedAt}}' nginx-prod 2>/dev/null || true)
          echo "PROD_NGINX_BEFORE=${NGINX_STARTED:-none}" >> "$GITHUB_ENV"

      - name: Build & restart changed local services
        working-directory: deployment
        run: |
          DC="docker compose -f docker-compose.local.yml --env-file .env.local"

          STOP="" BUILD="" START=""

          if [ "$BACKEND_CHANGED" = "true" ]; then
            STOP="$STOP app-local document-service-local"
            BUILD="$BUILD app-local document-service-local migrate-local"
            START="$START app-local document-service-local"
          fi
          if [ "$RADA_CHANGED" = "true" ]; then
            STOP="$STOP rada-mcp-app-local"
            BUILD="$BUILD rada-mcp-app-local rada-db-init-local rada-migrate-local"
            START="$START rada-mcp-app-local"
          fi
          if [ "$OPENREYESTR_CHANGED" = "true" ]; then
            STOP="$STOP app-openreyestr-local"
            BUILD="$BUILD app-openreyestr-local migrate-openreyestr-local"
            START="$START app-openreyestr-local"
          fi
          if [ "$FRONTEND_CHANGED" = "true" ]; then
            STOP="$STOP lexwebapp-local"
            BUILD="$BUILD lexwebapp-local"
            START="$START lexwebapp-local"
          fi

          [ -n "$STOP" ] && $DC stop $STOP 2>/dev/null || true
          [ -n "$STOP" ] && $DC rm -f $STOP 2>/dev/null || true
          [ -n "$BUILD" ] && $DC build $BUILD

          [ "$BACKEND_CHANGED" = "true" ] && { timeout 120 $DC up --abort-on-container-exit migrate-local || true; }
          [ "$RADA_CHANGED" = "true" ] && { timeout 120 $DC up --abort-on-container-exit rada-db-init-local || true; timeout 120 $DC up --abort-on-container-exit rada-migrate-local || true; }
          [ "$OPENREYESTR_CHANGED" = "true" ] && { timeout 120 $DC up --abort-on-container-exit migrate-openreyestr-local || true; }

          [ -n "$START" ] && $DC up -d $START

          $DC restart nginx-local
          docker image prune -f

      - name: Wait for local services to become healthy
        run: |
          DC="docker compose -f docker-compose.local.yml --env-file .env.local"
          FAILED=false

          # Wait for Docker healthcheck to report healthy (uses compose HEALTHCHECK config)
          wait_healthy() {
            local name=$1 container=$2 max_wait=${3:-120}
            local elapsed=0
            echo "Waiting for $name ($container) to become healthy (max ${max_wait}s)..."
            while [ $elapsed -lt $max_wait ]; do
              local status
              status=$(docker inspect --format='{{.State.Health.Status}}' "$container" 2>/dev/null || echo "not_found")
              case "$status" in
                healthy)
                  echo "✓ $name: healthy (${elapsed}s)"
                  return 0
                  ;;
                unhealthy)
                  echo "✗ $name: unhealthy after ${elapsed}s"
                  echo "::error::$name is unhealthy"
                  echo "Last health check output:"
                  docker inspect --format='{{range .State.Health.Log}}{{.Output}}{{end}}' "$container" 2>/dev/null | tail -5
                  FAILED=true
                  return 1
                  ;;
                *)
                  sleep 5
                  elapsed=$((elapsed + 5))
                  ;;
              esac
            done
            echo "✗ $name: timed out after ${max_wait}s (status: $status)"
            echo "::error::$name health check timed out"
            docker logs "$container" 2>&1 | tail -20
            FAILED=true
          }

          # HTTP health check for externally accessible services
          check_health() {
            local name=$1 url=$2
            for i in 1 2 3 4 5 6; do
              local response
              response=$(curl -sf --max-time 10 "$url" 2>&1) && {
                echo "✓ $name: OK"
                return 0
              }
              echo "$name: attempt $i failed ($response), retrying in 10s..."
              sleep 10
            done
            echo "::error::$name health check failed on local"
            FAILED=true
          }

          if [ "$BACKEND_CHANGED" = "true" ]; then
            wait_healthy "Backend" "secondlayer-app-local" 180
            wait_healthy "Document Service" "document-service-local" 120
          fi
          [ "$RADA_CHANGED" = "true" ] && wait_healthy "RADA" "rada-mcp-app-local" 120
          [ "$OPENREYESTR_CHANGED" = "true" ] && wait_healthy "OpenReyestr" "openreyestr-app-local" 120
          [ "$FRONTEND_CHANGED" = "true" ] && wait_healthy "Frontend" "lexwebapp-local" 60

          # Check nginx routes locally — only when backend is running (nginx proxies /health to backend)
          if [ "$BACKEND_CHANGED" = "true" ]; then
            check_health "Local via nginx" "http://localhost:80/health"
          fi

          # Verify prod was not affected by local deploy
          PROD_NGINX_NOW=$(docker inspect --format='{{.State.Status}}' nginx-prod 2>/dev/null || echo "absent")
          PROD_NGINX_STARTED=$(docker inspect --format='{{.State.StartedAt}}' nginx-prod 2>/dev/null || echo "none")
          if [ "$PROD_NGINX_BEFORE" = "none" ] || [ "$PROD_NGINX_BEFORE" = "" ]; then
            # Prod nginx wasn't running before deploy — nothing to protect
            echo "✓ Prod nginx not present on this runner — skipping safety check"
          elif [ "$PROD_NGINX_NOW" != "running" ]; then
            echo "::error::CRITICAL: prod nginx was running before deploy but is now $PROD_NGINX_NOW!"
            FAILED=true
          elif [ "$PROD_NGINX_STARTED" != "$PROD_NGINX_BEFORE" ]; then
            echo "::warning::Prod nginx was restarted during local deploy (was: $PROD_NGINX_BEFORE, now: $PROD_NGINX_STARTED)"
          else
            echo "✓ Prod nginx untouched"
          fi

          if [ "$FAILED" = "true" ]; then exit 1; fi
