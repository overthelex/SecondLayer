##############################################################################
# Pipeline: Local CI/CD
# - Runs on self-hosted runner (local.legal.org.ua)
# - Builds and tests all changed services in local Docker environment
# - Deploys ONLY changed services to production
# - Triggered on merge to main
##############################################################################
name: 'CI/CD: Local Build → Prod Deploy'

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: deploy-local-to-prod
  cancel-in-progress: false

jobs:
  # ─── Step 1: Detect what changed ─────────────────────────────────────
  detect-changes:
    name: Detect Changes
    runs-on: [self-hosted, local]
    outputs:
      shared: ${{ steps.changes.outputs.shared }}
      backend: ${{ steps.changes.outputs.backend }}
      rada: ${{ steps.changes.outputs.rada }}
      openreyestr: ${{ steps.changes.outputs.openreyestr }}
      frontend: ${{ steps.changes.outputs.frontend }}
      deployment: ${{ steps.changes.outputs.deployment }}
      any_backend: ${{ steps.changes.outputs.any_backend }}
      services_to_build: ${{ steps.changes.outputs.services_to_build }}
      services_to_deploy: ${{ steps.changes.outputs.services_to_deploy }}
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        uses: ./.github/actions/detect-changes

      - name: Check if any services need deploy
        id: check
        run: |
          SERVICES='${{ steps.changes.outputs.services_to_build }}'
          MONITORING='${{ steps.changes.outputs.monitoring }}'
          if [ "$SERVICES" = '[]' ] && [ "$MONITORING" != "true" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No services changed — skipping build/test/deploy"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

  # ─── Step 2: Build & test on local environment ─────────────────────
  build-and-test:
    name: Build & Test on Local
    runs-on: [self-hosted, local]
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    env:
      BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend }}
      RADA_CHANGED: ${{ needs.detect-changes.outputs.rada }}
      OPENREYESTR_CHANGED: ${{ needs.detect-changes.outputs.openreyestr }}
      FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure native build tools
        run: |
          if ! command -v make &>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq build-essential python3
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Build shared package
        run: cd packages/shared && npm ci && npm run build

      # Backend/RADA/OpenReyestr integration tests require running infrastructure (DB, Redis, MinIO).
      # CI runs TypeScript compilation + unit tests (mocked, no infra needed).
      - name: Build backend
        if: needs.detect-changes.outputs.backend == 'true'
        run: cd mcp_backend && npm ci && npm run build

      - name: Unit test backend (controllers)
        if: needs.detect-changes.outputs.backend == 'true'
        run: cd mcp_backend && npx jest --no-cache src/controllers/__tests__/ --forceExit

      - name: Build RADA
        if: needs.detect-changes.outputs.rada == 'true'
        run: cd mcp_rada && npm ci && npm run build

      - name: Build OpenReyestr
        if: needs.detect-changes.outputs.openreyestr == 'true'
        run: cd mcp_openreyestr && npm ci && npm run build

      - name: Test frontend
        if: needs.detect-changes.outputs.frontend == 'true'
        run: |
          cd lexwebapp
          npm ci --install-strategy=nested
          npm test
          npm run build
        env:
          VITE_API_URL: https://local.legal.org.ua

  # ─── Step 2b: Self-heal build failures with Claude Code ─────────────
  self-heal-build:
    name: Self-Heal Build Failures
    runs-on: [self-hosted, local]
    needs: [detect-changes, build-and-test]
    if: |
      always() &&
      needs.build-and-test.result == 'failure'
    env:
      CLAUDE_CODE_USE_BEDROCK: '1'
      CLAUDE_CODE_BEDROCK_MODEL: eu.anthropic.claude-sonnet-4-6
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: eu-central-1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
          token: ${{ github.token }}

      - name: Guard against infinite loops
        id: guard
        run: |
          # Check last 5 commits for autofix pattern (not just the last one)
          AUTOFIX_COUNT=$(git log -5 --format='%s' | grep -c '\[ci-autofix\]' || true)
          if [ "$AUTOFIX_COUNT" -ge 1 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Found $AUTOFIX_COUNT autofix commit(s) in last 5 — skipping to prevent loop"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch build error logs
        if: steps.guard.outputs.skip == 'false'
        id: errors
        run: |
          RUN_ID="${{ github.run_id }}"
          gh run view "$RUN_ID" --log-failed 2>&1 | tail -100 > /tmp/ci-errors.log
          echo "Captured $(wc -l < /tmp/ci-errors.log) lines of error logs"

      - name: Claude Code — diagnose and fix
        if: steps.guard.outputs.skip == 'false'
        id: claude-fix
        run: |
          ERROR_LOG=$(cat /tmp/ci-errors.log)
          BRANCH_NAME="ci-autofix/$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}"

          git checkout -b "$BRANCH_NAME"

          npx -y @anthropic-ai/claude-code@latest -p "$(cat <<PROMPT
          The CI/CD build-and-test job failed. Here are the error logs:

          \`\`\`
          ${ERROR_LOG}
          \`\`\`

          Your task:
          1. Analyze the errors and identify the root cause
          2. Fix the code — edit the minimal set of files needed
          3. Run the TypeScript build (npm run build in the affected service) to verify your fix compiles
          4. Stage ONLY the files you changed and commit with message: "fix: [ci-autofix] <description>"
          5. Do NOT push — the pipeline will handle pushing and PR creation

          Rules:
          - Do NOT change test expectations to make tests pass — fix the actual code
          - Do NOT modify CI workflow files
          - Do NOT install new dependencies unless absolutely necessary
          - Do NOT run git push
          - If the error is in environment config (missing env vars, wrong URLs), fix it in the workflow env or skip
          - If you cannot fix the issue, create a GitHub issue describing the problem instead of committing broken code

          Working directory: $(pwd)
          PROMPT
          )" --allowedTools "Bash,Read,Edit,Write,Glob,Grep" --max-turns 25 --model eu.anthropic.claude-sonnet-4-6
        timeout-minutes: 10

      - name: Check if fix was produced
        if: steps.guard.outputs.skip == 'false'
        id: check-fix
        run: |
          CURRENT_BRANCH=$(git branch --show-current)
          if git log --oneline "main..$CURRENT_BRANCH" 2>/dev/null | grep -q .; then
            echo "has_fix=true" >> "$GITHUB_OUTPUT"
            echo "branch=$CURRENT_BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "has_fix=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Claude Code did not produce a fix"
          fi

      - name: Push branch and create PR
        if: steps.guard.outputs.skip == 'false' && steps.check-fix.outputs.has_fix == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BRANCH="${{ steps.check-fix.outputs.branch }}"
          git push origin "$BRANCH"

          gh pr create \
            --title "fix: [ci-autofix] Auto-fix for build failure" \
            --body "$(cat <<EOF
          ## Auto-generated fix

          Claude Code analyzed the CI build failure and produced this fix automatically.

          **Source run:** $RUN_URL

          > Review carefully before merging — this is an automated fix.

          🤖 Generated with [Claude Code](https://claude.com/claude-code)
          EOF
          )" \
            --base main \
            --head "$BRANCH"

  # ─── Step 3: Deploy to local & integration test ─────────────────────
  local-deploy-and-test:
    name: Deploy to Local & Integration Test
    runs-on: [self-hosted, local]
    needs: [detect-changes, build-and-test]
    if: |
      always() &&
      needs.build-and-test.result == 'success'
    env:
      BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend }}
      RADA_CHANGED: ${{ needs.detect-changes.outputs.rada }}
      OPENREYESTR_CHANGED: ${{ needs.detect-changes.outputs.openreyestr }}
      FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Build dist for changed services
        run: |
          npm --prefix packages/shared install && npm --prefix packages/shared run build

          [ "$BACKEND_CHANGED" = "true" ] && \
            npm --prefix mcp_backend install && npm --prefix mcp_backend run build || true
          [ "$RADA_CHANGED" = "true" ] && \
            npm --prefix mcp_rada install && npm --prefix mcp_rada run build || true
          [ "$OPENREYESTR_CHANGED" = "true" ] && \
            npm --prefix mcp_openreyestr install && npm --prefix mcp_openreyestr run build || true

      - name: Link env files from main repo
        run: |
          ln -sf /home/vovkes/SecondLayer/deployment/.env.local deployment/.env.local
          ln -sf /home/vovkes/SecondLayer/deployment/.env.prod deployment/.env.prod 2>/dev/null || true

      - name: Build & restart changed local services
        working-directory: deployment
        run: |
          DC="docker compose -f docker-compose.local.yml --env-file .env.local"

          STOP="" BUILD="" START=""

          if [ "$BACKEND_CHANGED" = "true" ]; then
            STOP="$STOP app-local document-service-local"
            BUILD="$BUILD app-local document-service-local migrate-local"
            START="$START app-local document-service-local"
          fi
          if [ "$RADA_CHANGED" = "true" ]; then
            STOP="$STOP rada-mcp-app-local"
            BUILD="$BUILD rada-mcp-app-local rada-db-init-local rada-migrate-local"
            START="$START rada-mcp-app-local"
          fi
          if [ "$OPENREYESTR_CHANGED" = "true" ]; then
            STOP="$STOP app-openreyestr-local"
            BUILD="$BUILD app-openreyestr-local migrate-openreyestr-local"
            START="$START app-openreyestr-local"
          fi
          if [ "$FRONTEND_CHANGED" = "true" ]; then
            STOP="$STOP lexwebapp-local"
            BUILD="$BUILD lexwebapp-local"
            START="$START lexwebapp-local"
          fi

          [ -n "$STOP" ] && $DC stop $STOP 2>/dev/null || true
          [ -n "$STOP" ] && $DC rm -f $STOP 2>/dev/null || true
          [ -n "$BUILD" ] && $DC build $BUILD

          [ "$BACKEND_CHANGED" = "true" ] && { $DC up migrate-local || true; }
          [ "$RADA_CHANGED" = "true" ] && { $DC up rada-db-init-local || true; $DC up rada-migrate-local || true; }
          [ "$OPENREYESTR_CHANGED" = "true" ] && { $DC up migrate-openreyestr-local || true; }

          [ -n "$START" ] && $DC up -d $START

          $DC restart nginx-local
          docker image prune -f

      - name: Wait for local services to become healthy
        run: |
          DC="docker compose -f docker-compose.local.yml --env-file .env.local"
          FAILED=false

          # Wait for Docker healthcheck to report healthy (uses compose HEALTHCHECK config)
          wait_healthy() {
            local name=$1 container=$2 max_wait=${3:-120}
            local elapsed=0
            echo "Waiting for $name ($container) to become healthy (max ${max_wait}s)..."
            while [ $elapsed -lt $max_wait ]; do
              local status
              status=$(docker inspect --format='{{.State.Health.Status}}' "$container" 2>/dev/null || echo "not_found")
              case "$status" in
                healthy)
                  echo "✓ $name: healthy (${elapsed}s)"
                  return 0
                  ;;
                unhealthy)
                  echo "✗ $name: unhealthy after ${elapsed}s"
                  echo "::error::$name is unhealthy"
                  echo "Last health check output:"
                  docker inspect --format='{{range .State.Health.Log}}{{.Output}}{{end}}' "$container" 2>/dev/null | tail -5
                  FAILED=true
                  return 1
                  ;;
                *)
                  sleep 5
                  elapsed=$((elapsed + 5))
                  ;;
              esac
            done
            echo "✗ $name: timed out after ${max_wait}s (status: $status)"
            echo "::error::$name health check timed out"
            docker logs "$container" 2>&1 | tail -20
            FAILED=true
          }

          # HTTP health check for externally accessible services
          check_health() {
            local name=$1 url=$2
            for i in 1 2 3 4 5 6; do
              local response
              response=$(curl -sf --max-time 10 "$url" 2>&1) && {
                echo "✓ $name: OK"
                return 0
              }
              echo "$name: attempt $i failed ($response), retrying in 10s..."
              sleep 10
            done
            echo "::error::$name health check failed on local"
            FAILED=true
          }

          [ "$BACKEND_CHANGED" = "true" ] && wait_healthy "Backend" "secondlayer-app-local" 180
          [ "$RADA_CHANGED" = "true" ] && wait_healthy "RADA" "rada-mcp-app-local" 120
          [ "$OPENREYESTR_CHANGED" = "true" ] && wait_healthy "OpenReyestr" "openreyestr-app-local" 120

          check_health "Local (public)" "https://local.legal.org.ua/health"

          if [ "$FAILED" = "true" ]; then exit 1; fi

  # ─── Step 4: Deploy to production ───────────────────────────────────
  deploy-prod:
    name: Deploy to Production
    runs-on: [self-hosted, local]
    needs: [detect-changes, local-deploy-and-test]
    if: |
      always() &&
      needs.local-deploy-and-test.result == 'success'
    environment: production
    env:
      PROD_SERVER: '18.192.189.254'
      PROD_USER: 'ubuntu'
      BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend }}
      RADA_CHANGED: ${{ needs.detect-changes.outputs.rada }}
      OPENREYESTR_CHANGED: ${{ needs.detect-changes.outputs.openreyestr }}
      FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
      MONITORING_CHANGED: ${{ needs.detect-changes.outputs.monitoring }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy changed services to prod (blue-green)
        env:
          PROD_SSH_KEY_PATH: ${{ secrets.PROD_SSH_KEY_PATH }}
        run: |
          SSH_CMD="ssh -i $PROD_SSH_KEY_PATH -o StrictHostKeyChecking=no ${PROD_USER}@${PROD_SERVER}"
          REMOTE_REPO="/home/${PROD_USER}/SecondLayer"

          echo "=== Blue-green deploy to production ==="

          # Pull latest code and tags
          $SSH_CMD "git -C ${REMOTE_REPO} fetch origin main --tags && git -C ${REMOTE_REPO} reset --hard origin/main"

          # Write VERSION file for frontend build
          LATEST_TAG=$(git tag -l "v*" --sort=-version:refname | head -1)
          $SSH_CMD "echo '${LATEST_TAG:-dev}' > ${REMOTE_REPO}/VERSION"

          # Build dist on prod
          $SSH_CMD "cd ${REMOTE_REPO} && npm --prefix packages/shared install && npm --prefix packages/shared run build"

          [ "$BACKEND_CHANGED" = "true" ] && \
            $SSH_CMD "cd ${REMOTE_REPO} && npm --prefix mcp_backend install && npm --prefix mcp_backend run build"
          [ "$RADA_CHANGED" = "true" ] && \
            $SSH_CMD "cd ${REMOTE_REPO} && npm --prefix mcp_rada install && npm --prefix mcp_rada run build"
          [ "$OPENREYESTR_CHANGED" = "true" ] && \
            $SSH_CMD "cd ${REMOTE_REPO} && npm --prefix mcp_openreyestr install && npm --prefix mcp_openreyestr run build"

          # Blue-green rolling deploy
          $SSH_CMD bash << DEPLOY_SCRIPT
            set -e
            cd ${REMOTE_REPO}/deployment
            export APP_VERSION=\$(cat ${REMOTE_REPO}/VERSION 2>/dev/null || echo 'dev')
            DC="docker compose -f docker-compose.prod.yml --env-file .env.prod"

            # --- Determine active colors (per service group) ---
            BACKEND_COLOR=\$(grep '^backend=' .active-colors 2>/dev/null | cut -d= -f2 || echo "blue")
            FRONTEND_COLOR=\$(grep '^frontend=' .active-colors 2>/dev/null | cut -d= -f2 || echo "blue")
            [ "\$BACKEND_COLOR" = "green" ] && NEW_BACKEND="blue" || NEW_BACKEND="green"
            [ "\$FRONTEND_COLOR" = "green" ] && NEW_FRONTEND="blue" || NEW_FRONTEND="green"

            ANY_BACKEND=false
            if [ "${BACKEND_CHANGED}" = "true" ] || [ "${RADA_CHANGED}" = "true" ] || [ "${OPENREYESTR_CHANGED}" = "true" ]; then
              ANY_BACKEND=true
            fi

            echo "Backend: \$BACKEND_COLOR → \$NEW_BACKEND (changed: \$ANY_BACKEND)"
            echo "Frontend: \$FRONTEND_COLOR → \$NEW_FRONTEND (changed: ${FRONTEND_CHANGED})"

            # --- 1. Build images (old containers still serving traffic) ---
            BUILD=""
            [ "${BACKEND_CHANGED}" = "true" ] && BUILD="\$BUILD app-prod document-service-prod migrate-prod"
            [ "${RADA_CHANGED}" = "true" ] && BUILD="\$BUILD rada-mcp-app-prod rada-db-init-prod rada-migrate-prod"
            [ "${OPENREYESTR_CHANGED}" = "true" ] && BUILD="\$BUILD app-openreyestr-prod migrate-openreyestr-prod"
            [ "${FRONTEND_CHANGED}" = "true" ] && BUILD="\$BUILD lexwebapp-prod"
            [ -n "\$BUILD" ] && \$DC build \$BUILD

            # --- 2. Run migrations (idempotent, safe while old containers serve) ---
            [ "${BACKEND_CHANGED}" = "true" ] && { \$DC up migrate-prod || true; }
            [ "${RADA_CHANGED}" = "true" ] && { \$DC up rada-db-init-prod || true; \$DC up rada-migrate-prod || true; }
            [ "${OPENREYESTR_CHANGED}" = "true" ] && { \$DC up migrate-openreyestr-prod || true; }

            # --- 3. Start new-color containers alongside old ones ---
            # When any backend service changes, start ALL backend services in new color
            # (green services form a self-contained cluster referencing each other)
            if [ "\$ANY_BACKEND" = "true" ]; then
              if [ "\$NEW_BACKEND" = "green" ]; then
                \$DC --profile green up -d app-prod-green document-service-prod-green rada-mcp-app-prod-green app-openreyestr-prod-green
              else
                \$DC up -d app-prod document-service-prod rada-mcp-app-prod app-openreyestr-prod
              fi
            fi
            if [ "${FRONTEND_CHANGED}" = "true" ]; then
              if [ "\$NEW_FRONTEND" = "green" ]; then
                \$DC --profile green up -d lexwebapp-prod-green
              else
                \$DC up -d lexwebapp-prod
              fi
            fi

            # --- 4. Wait for new containers to be healthy ---
            wait_healthy() {
              local container=\$1 max_wait=\${2:-120} elapsed=0
              echo "Waiting for \$container to be healthy..."
              while [ \$elapsed -lt \$max_wait ]; do
                local status
                status=\$(docker inspect --format='{{.State.Health.Status}}' "\$container" 2>/dev/null || echo "not_found")
                case "\$status" in
                  healthy) echo "✓ \$container: healthy (\${elapsed}s)"; return 0 ;;
                  unhealthy)
                    echo "✗ \$container: unhealthy after \${elapsed}s"
                    docker logs --tail=20 "\$container" 2>&1
                    return 1 ;;
                  *) sleep 5; elapsed=\$((elapsed + 5)) ;;
                esac
              done
              echo "✗ \$container: timed out (\${max_wait}s)"
              docker logs --tail=20 "\$container" 2>&1
              return 1
            }

            HEALTH_OK=true
            if [ "\$ANY_BACKEND" = "true" ]; then
              if [ "\$NEW_BACKEND" = "green" ]; then
                wait_healthy "secondlayer-app-prod-green" 180 || HEALTH_OK=false
                wait_healthy "document-service-prod-green" 120 || HEALTH_OK=false
                wait_healthy "rada-mcp-app-prod-green" 120 || HEALTH_OK=false
                wait_healthy "openreyestr-app-prod-green" 120 || HEALTH_OK=false
              else
                wait_healthy "secondlayer-app-prod" 180 || HEALTH_OK=false
                wait_healthy "document-service-prod" 120 || HEALTH_OK=false
                wait_healthy "rada-mcp-app-prod" 120 || HEALTH_OK=false
                wait_healthy "openreyestr-app-prod" 120 || HEALTH_OK=false
              fi
            fi
            if [ "${FRONTEND_CHANGED}" = "true" ]; then
              if [ "\$NEW_FRONTEND" = "green" ]; then
                wait_healthy "lexwebapp-prod-green" 60 || HEALTH_OK=false
              else
                wait_healthy "lexwebapp-prod" 60 || HEALTH_OK=false
              fi
            fi

            if [ "\$HEALTH_OK" != "true" ]; then
              echo "::error::New containers failed health check — aborting (old containers still serving)"
              # Stop failed new containers
              if [ "\$ANY_BACKEND" = "true" ]; then
                if [ "\$NEW_BACKEND" = "green" ]; then
                  \$DC --profile green stop app-prod-green document-service-prod-green rada-mcp-app-prod-green app-openreyestr-prod-green 2>/dev/null || true
                  \$DC --profile green rm -f app-prod-green document-service-prod-green rada-mcp-app-prod-green app-openreyestr-prod-green 2>/dev/null || true
                else
                  \$DC stop app-prod document-service-prod rada-mcp-app-prod app-openreyestr-prod 2>/dev/null || true
                  \$DC rm -f app-prod document-service-prod rada-mcp-app-prod app-openreyestr-prod 2>/dev/null || true
                fi
              fi
              if [ "${FRONTEND_CHANGED}" = "true" ]; then
                if [ "\$NEW_FRONTEND" = "green" ]; then
                  \$DC --profile green stop lexwebapp-prod-green 2>/dev/null || true
                  \$DC --profile green rm -f lexwebapp-prod-green 2>/dev/null || true
                else
                  \$DC stop lexwebapp-prod 2>/dev/null || true
                  \$DC rm -f lexwebapp-prod 2>/dev/null || true
                fi
              fi
              exit 1
            fi

            # --- 5. Switch nginx upstreams to new color ---
            if [ "\$ANY_BACKEND" = "true" ]; then
              [ "\$NEW_BACKEND" = "green" ] && BE_HOST="secondlayer-app-prod-green" || BE_HOST="secondlayer-app-prod"
            else
              [ "\$BACKEND_COLOR" = "green" ] && BE_HOST="secondlayer-app-prod-green" || BE_HOST="secondlayer-app-prod"
            fi
            if [ "${FRONTEND_CHANGED}" = "true" ]; then
              [ "\$NEW_FRONTEND" = "green" ] && FE_HOST="lexwebapp-prod-green" || FE_HOST="lexwebapp-prod"
            else
              [ "\$FRONTEND_COLOR" = "green" ] && FE_HOST="lexwebapp-prod-green" || FE_HOST="lexwebapp-prod"
            fi

            printf '# Active upstreams — managed by deploy script (blue-green switching)\n# DO NOT EDIT MANUALLY — overwritten during zero-downtime deploy\n\nupstream prod_mcp_backend {\n    server %s:3000;\n    keepalive 128;\n}\n\nupstream prod_frontend {\n    server %s:80;\n    keepalive 32;\n}\n' "\$BE_HOST" "\$FE_HOST" > nginx/includes/prod-upstreams.conf

            # Validate and reload nginx (graceful, zero-downtime)
            docker exec nginx-prod nginx -t
            docker exec nginx-prod nginx -s reload
            echo "Nginx reloaded — traffic switched to new containers"

            # Allow in-flight requests to complete
            sleep 5

            # --- 6. Stop old-color containers ---
            if [ "\$ANY_BACKEND" = "true" ]; then
              if [ "\$BACKEND_COLOR" = "green" ]; then
                \$DC --profile green stop app-prod-green document-service-prod-green rada-mcp-app-prod-green app-openreyestr-prod-green 2>/dev/null || true
                \$DC --profile green rm -f app-prod-green document-service-prod-green rada-mcp-app-prod-green app-openreyestr-prod-green 2>/dev/null || true
              else
                \$DC stop app-prod document-service-prod rada-mcp-app-prod app-openreyestr-prod 2>/dev/null || true
                \$DC rm -f app-prod document-service-prod rada-mcp-app-prod app-openreyestr-prod 2>/dev/null || true
              fi
              BACKEND_COLOR="\$NEW_BACKEND"
            fi
            if [ "${FRONTEND_CHANGED}" = "true" ]; then
              if [ "\$FRONTEND_COLOR" = "green" ]; then
                \$DC --profile green stop lexwebapp-prod-green 2>/dev/null || true
                \$DC --profile green rm -f lexwebapp-prod-green 2>/dev/null || true
              else
                \$DC stop lexwebapp-prod 2>/dev/null || true
                \$DC rm -f lexwebapp-prod 2>/dev/null || true
              fi
              FRONTEND_COLOR="\$NEW_FRONTEND"
            fi

            # --- 7. Save active colors ---
            printf 'backend=%s\nfrontend=%s\n' "\$BACKEND_COLOR" "\$FRONTEND_COLOR" > .active-colors

            # Restart monitoring if needed
            if [ "${MONITORING_CHANGED}" = "true" ]; then
              echo "=== Restarting monitoring services ==="
              \$DC restart grafana-prod prometheus-prod 2>/dev/null || true
            fi

            docker image prune -f
          DEPLOY_SCRIPT

      - name: Prod health check
        env:
          PROD_SSH_KEY_PATH: ${{ secrets.PROD_SSH_KEY_PATH }}
        run: |
          SSH_CMD="ssh -i $PROD_SSH_KEY_PATH -o StrictHostKeyChecking=no ${PROD_USER}@${PROD_SERVER}"

          # Full health check through nginx (works regardless of blue/green)
          for i in 1 2 3 4 5; do
            HEALTH=$($SSH_CMD "curl -sf --max-time 10 http://localhost/health" 2>/dev/null) && {
              echo "=== Production health (via nginx) ==="
              echo "$HEALTH" | jq . 2>/dev/null || echo "$HEALTH"
              STATUS=$(echo "$HEALTH" | jq -r '.status' 2>/dev/null)
              if [ "$STATUS" = "degraded" ]; then
                echo "::warning::Production is degraded"
                echo "$HEALTH" | jq -r '.checks | to_entries[] | select(.value.ok == false) | "  ✗ \(.key): \(.value.error)"' 2>/dev/null
              else
                echo "✓ All checks passed"
              fi
              break
            }
            [ $i -eq 5 ] && echo "::error::Production health check failed" && exit 1
            sleep 10
          done

          for i in 1 2 3; do
            PUBLIC_HEALTH=$(curl -sf --max-time 15 "https://legal.org.ua/health" 2>/dev/null) && {
              echo "=== Production health (public) ==="
              echo "$PUBLIC_HEALTH" | jq . 2>/dev/null || echo "$PUBLIC_HEALTH"
              break
            }
            [ $i -eq 3 ] && echo "::warning::Public health check timed out — may be Cloudflare cache"
            sleep 5
          done

  # ─── Step 4b: Self-heal deploy failures ─────────────────────────────
  self-heal-deploy:
    name: Self-Heal Deploy Failures
    runs-on: [self-hosted, local]
    needs: [detect-changes, deploy-prod]
    if: |
      always() &&
      needs.deploy-prod.result == 'failure'
    env:
      CLAUDE_CODE_USE_BEDROCK: '1'
      CLAUDE_CODE_BEDROCK_MODEL: eu.anthropic.claude-sonnet-4-6
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: eu-central-1
      PROD_SERVER: '18.192.189.254'
      PROD_USER: 'ubuntu'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
          token: ${{ github.token }}

      - name: Guard against infinite loops
        id: guard
        run: |
          AUTOFIX_COUNT=$(git log -5 --format='%s' | grep -c '\[ci-autofix\]' || true)
          if [ "$AUTOFIX_COUNT" -ge 1 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Found $AUTOFIX_COUNT autofix commit(s) in last 5 — skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect prod diagnostics
        if: steps.guard.outputs.skip == 'false'
        id: diag
        env:
          PROD_SSH_KEY_PATH: ${{ secrets.PROD_SSH_KEY_PATH }}
        run: |
          SSH_CMD="ssh -i $PROD_SSH_KEY_PATH -o StrictHostKeyChecking=no ${PROD_USER}@${PROD_SERVER}"
          REMOTE_REPO="/home/${PROD_USER}/SecondLayer"

          {
            echo "=== Docker container status ==="
            $SSH_CMD "cd ${REMOTE_REPO}/deployment && docker compose -f docker-compose.prod.yml ps" 2>&1 || true

            echo ""
            echo "=== Last 30 lines from failing containers ==="
            for svc in app-prod rada-mcp-app-prod app-openreyestr-prod nginx-prod lexwebapp-prod; do
              echo "--- $svc ---"
              $SSH_CMD "cd ${REMOTE_REPO}/deployment && docker compose -f docker-compose.prod.yml logs --tail=30 $svc" 2>&1 || true
            done

            echo ""
            echo "=== Health check responses ==="
            $SSH_CMD "curl -sf http://localhost:3007/health 2>&1 || echo 'Backend health: FAILED'"
            $SSH_CMD "curl -sf http://localhost:3001/health 2>&1 || echo 'RADA health: FAILED'"
          } > /tmp/deploy-diag.log 2>&1

          echo "Captured $(wc -l < /tmp/deploy-diag.log) lines of diagnostics"

      - name: Claude Code — diagnose and create fix PR
        if: steps.guard.outputs.skip == 'false'
        id: claude-fix
        run: |
          DIAG_LOG=$(cat /tmp/deploy-diag.log)
          FAILED_RUN_LOG=$(gh run view "${{ github.run_id }}" --log-failed 2>&1 | tail -80)
          BRANCH_NAME="ci-autofix/deploy-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA:0:7}"

          git checkout -b "$BRANCH_NAME"

          npx -y @anthropic-ai/claude-code@latest -p "$(cat <<PROMPT
          Production deployment failed. Here are the diagnostics:

          === CI Run Error Log ===
          ${FAILED_RUN_LOG}

          === Production Server Diagnostics ===
          ${DIAG_LOG}

          Your task:
          1. Analyze the failure — is it a code bug, config issue, Docker build error, or infrastructure problem?
          2. If it's a code fix (typo, missing import, wrong env var, Docker config):
             - Fix the code locally
             - Stage ONLY the files you changed and commit with message: "fix: [ci-autofix] <description>"
             - Do NOT push — the pipeline will handle pushing and PR creation
          3. If you cannot fix it with code changes, create a GitHub issue describing the problem

          Rules:
          - Do NOT SSH to production servers — no direct prod access
          - Do NOT run git push
          - Do NOT modify CI workflow files
          - Do NOT run git reset, git revert, or any destructive git commands
          - Focus on identifying and fixing the root cause in code

          Working directory: $(pwd)
          PROMPT
          )" --allowedTools "Bash,Read,Edit,Write,Glob,Grep" --max-turns 25 --model eu.anthropic.claude-sonnet-4-6
        timeout-minutes: 10

      - name: Check if fix was produced
        if: steps.guard.outputs.skip == 'false'
        id: check-fix
        run: |
          CURRENT_BRANCH=$(git branch --show-current)
          if git log --oneline "main..$CURRENT_BRANCH" 2>/dev/null | grep -q .; then
            echo "has_fix=true" >> "$GITHUB_OUTPUT"
            echo "branch=$CURRENT_BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "has_fix=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Claude Code did not produce a fix — manual intervention needed"
          fi

      - name: Push branch and create PR
        if: steps.guard.outputs.skip == 'false' && steps.check-fix.outputs.has_fix == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BRANCH="${{ steps.check-fix.outputs.branch }}"
          git push origin "$BRANCH"

          gh pr create \
            --title "fix: [ci-autofix] Auto-fix for deploy failure" \
            --body "$(cat <<EOF
          ## Auto-generated fix for deploy failure

          Claude Code analyzed the production deploy failure and produced this fix.

          **Source run:** $RUN_URL

          > ⚠️ Production may be in a degraded state. Review and merge promptly, or rollback manually.

          🤖 Generated with [Claude Code](https://claude.com/claude-code)
          EOF
          )" \
            --base main \
            --head "$BRANCH"

  # ─── Step 5: Create release ────────────────────────────────────────
  create-release:
    name: Create Release
    runs-on: [self-hosted, local]
    needs: [detect-changes, deploy-prod]
    if: |
      always() &&
      needs.deploy-prod.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          SERVICES_TO_DEPLOY: ${{ needs.detect-changes.outputs.services_to_deploy }}
        run: |
          # Determine next version based on conventional commits
          LAST_TAG=$(git tag -l "v*" --sort=-version:refname | head -1)

          if [ -z "$LAST_TAG" ]; then
            # First release ever
            NEXT_VERSION="v1.0.0"
            COMMITS=$(git log --oneline --no-merges -50)
          else
            COMMITS=$(git log "${LAST_TAG}..HEAD" --oneline --no-merges)

            # Parse current version
            CURRENT="${LAST_TAG#v}"
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            PATCH=$(echo "$CURRENT" | cut -d. -f3)

            # Determine bump type from commit messages
            if echo "$COMMITS" | grep -qiE "^[a-f0-9]+ (feat|refactor)!:|BREAKING CHANGE"; then
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
            elif echo "$COMMITS" | grep -qiE "^[a-f0-9]+ feat(\(|:)"; then
              MINOR=$((MINOR + 1)); PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
            NEXT_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          # Build changelog grouped by type
          FEATURES=$(echo "$COMMITS" | grep -iE "^[a-f0-9]+ feat(\(|:)" | sed 's/^[a-f0-9]* /- /' || true)
          FIXES=$(echo "$COMMITS" | grep -iE "^[a-f0-9]+ fix(\(|:)" | sed 's/^[a-f0-9]* /- /' || true)
          OTHER=$(echo "$COMMITS" | grep -viE "^[a-f0-9]+ (feat|fix)(\(|:)" | grep -v "^$" | sed 's/^[a-f0-9]* /- /' || true)

          # Build release body
          BODY="## Deployed Services\n"
          BODY="${BODY}\n\`${SERVICES_TO_DEPLOY}\`\n"

          if [ -n "$FEATURES" ]; then
            BODY="${BODY}\n## Features\n${FEATURES}\n"
          fi
          if [ -n "$FIXES" ]; then
            BODY="${BODY}\n## Fixes\n${FIXES}\n"
          fi
          if [ -n "$OTHER" ]; then
            BODY="${BODY}\n## Other\n${OTHER}\n"
          fi

          BODY="${BODY}\n---\n**Commit:** ${GITHUB_SHA:0:7} | **Runner:** local"

          echo "Creating release $NEXT_VERSION"

          # Create tag and release
          git tag "$NEXT_VERSION"
          git push origin "$NEXT_VERSION"

          printf "%b" "$BODY" | gh release create "$NEXT_VERSION" \
            --title "$NEXT_VERSION" \
            --notes-file - \
            --latest
