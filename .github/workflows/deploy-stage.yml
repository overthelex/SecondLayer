name: Deploy Stage

on:
  push:
    branches: [main]

concurrency:
  group: deploy-stage
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to stage
    runs-on: ubuntu-latest
    environment: stage
    timeout-minutes: 15
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGE_HOST }}
          username: ${{ secrets.STAGE_USER }}
          key: ${{ secrets.STAGE_SSH_KEY }}
          script_stop: true
          command_timeout: 12m
          script: |
            cd /home/${{ secrets.STAGE_USER }}/SecondLayer

            echo "=== Pulling latest code ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Building shared package ==="
            cd packages/shared && npm run build && cd ../..

            echo "=== Building backend (for pre-build) ==="
            cd mcp_backend && npm run build && cd ..

            echo "=== Deploying containers ==="
            cd deployment

            # Stop app containers (keep DBs running)
            docker compose -f docker-compose.stage.yml --env-file .env.stage stop \
              secondlayer-app-stage rada-mcp-app-stage openreyestr-app-stage \
              document-service-stage lexwebapp-stage nginx-stage

            # Rebuild and start
            docker compose -f docker-compose.stage.yml --env-file .env.stage build --no-cache \
              secondlayer-app-stage rada-mcp-app-stage openreyestr-app-stage \
              document-service-stage lexwebapp-stage

            docker compose -f docker-compose.stage.yml --env-file .env.stage up -d

            echo "=== Running migrations ==="
            docker compose -f docker-compose.stage.yml --env-file .env.stage exec -T \
              secondlayer-app-stage node dist/migrations/migrate.js || true
            docker compose -f docker-compose.stage.yml --env-file .env.stage exec -T \
              rada-mcp-app-stage node dist/migrations/migrate.js || true
            docker compose -f docker-compose.stage.yml --env-file .env.stage exec -T \
              openreyestr-app-stage node dist/migrations/migrate.js || true

            # Restart nginx to pick up new upstream IPs
            docker compose -f docker-compose.stage.yml --env-file .env.stage restart nginx-stage

            echo "=== Health check ==="
            sleep 10
            curl -sf http://localhost:3004/health || echo "WARNING: health check failed"
            echo ""
            echo "=== Deploy complete ==="
