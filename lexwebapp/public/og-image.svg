<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#0d0d18"/>
      <stop offset="100%" stop-color="#080812"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="textFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
    <!-- Fractal-inspired pattern -->
    <radialGradient id="glow1" cx="75%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#0d9488" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="70%" r="30%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="20%" cy="80%" r="35%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient glows -->
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#glow3)"/>

  <!-- Geometric pattern (fractal-inspired) -->
  <!-- Concentric arcs top-right -->
  <g opacity="0.07" stroke="#0d9488" fill="none" stroke-width="0.8">
    <circle cx="950" cy="120" r="80"/>
    <circle cx="950" cy="120" r="130"/>
    <circle cx="950" cy="120" r="190"/>
    <circle cx="950" cy="120" r="260"/>
    <circle cx="950" cy="120" r="340"/>
  </g>

  <!-- Grid dots pattern -->
  <g opacity="0.04" fill="#a1a1aa">
    <circle cx="800" cy="200" r="1.5"/>
    <circle cx="840" cy="200" r="1.5"/>
    <circle cx="880" cy="200" r="1.5"/>
    <circle cx="920" cy="200" r="1.5"/>
    <circle cx="960" cy="200" r="1.5"/>
    <circle cx="1000" cy="200" r="1.5"/>
    <circle cx="1040" cy="200" r="1.5"/>
    <circle cx="800" cy="240" r="1.5"/>
    <circle cx="840" cy="240" r="1.5"/>
    <circle cx="880" cy="240" r="1.5"/>
    <circle cx="920" cy="240" r="1.5"/>
    <circle cx="960" cy="240" r="1.5"/>
    <circle cx="1000" cy="240" r="1.5"/>
    <circle cx="1040" cy="240" r="1.5"/>
    <circle cx="800" cy="280" r="1.5"/>
    <circle cx="840" cy="280" r="1.5"/>
    <circle cx="880" cy="280" r="1.5"/>
    <circle cx="920" cy="280" r="1.5"/>
    <circle cx="960" cy="280" r="1.5"/>
    <circle cx="1000" cy="280" r="1.5"/>
    <circle cx="1040" cy="280" r="1.5"/>
    <circle cx="800" cy="320" r="1.5"/>
    <circle cx="840" cy="320" r="1.5"/>
    <circle cx="880" cy="320" r="1.5"/>
    <circle cx="920" cy="320" r="1.5"/>
    <circle cx="960" cy="320" r="1.5"/>
    <circle cx="1000" cy="320" r="1.5"/>
    <circle cx="1040" cy="320" r="1.5"/>
  </g>

  <!-- Subtle diagonal lines -->
  <g opacity="0.03" stroke="#6366f1" stroke-width="0.5">
    <line x1="700" y1="0" x2="1200" y2="500"/>
    <line x1="750" y1="0" x2="1200" y2="450"/>
    <line x1="800" y1="0" x2="1200" y2="400"/>
    <line x1="850" y1="0" x2="1200" y2="350"/>
  </g>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)" opacity="0.7"/>

  <!-- Left content area -->
  <!-- Eyebrow badge -->
  <rect x="80" y="160" width="130" height="26" rx="3" fill="none" stroke="#3f3f46" stroke-width="0.8"/>
  <text x="145" y="177" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="2.5">FOR LAW FIRMS</text>

  <!-- Main headline -->
  <text x="80" y="248" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="56" font-weight="700" fill="#fafafa" letter-spacing="-1.5">
    <tspan>LEX</tspan>
  </text>
  <text x="80" y="310" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="600" fill="#fafafa" letter-spacing="-1">
    <tspan>AI Legal Analysis.</tspan>
  </text>
  <text x="80" y="358" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="40" font-weight="600" fill="#71717a" letter-spacing="-1">
    <tspan>Partner Level.</tspan>
  </text>

  <!-- Description -->
  <text x="80" y="410" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#a1a1aa" letter-spacing="0.2">
    <tspan x="80" dy="0">Semantic search across 110M+ court decisions.</tspan>
    <tspan x="80" dy="24">Case law analysis. Legislative monitoring. 12 jurisdictions.</tspan>
  </text>

  <!-- Feature pills -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="500">
    <!-- Pill 1 -->
    <rect x="80" y="468" width="130" height="30" rx="4" fill="#0d9488" fill-opacity="0.1" stroke="#0d9488" stroke-opacity="0.25" stroke-width="0.8"/>
    <text x="145" y="487" fill="#5eead4" text-anchor="middle">110M+ Decisions</text>

    <!-- Pill 2 -->
    <rect x="222" y="468" width="100" height="30" rx="4" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-opacity="0.25" stroke-width="0.8"/>
    <text x="272" y="487" fill="#a5b4fc" text-anchor="middle">AI Analysis</text>

    <!-- Pill 3 -->
    <rect x="334" y="468" width="140" height="30" rx="4" fill="#0d9488" fill-opacity="0.1" stroke="#0d9488" stroke-opacity="0.25" stroke-width="0.8"/>
    <text x="404" y="487" fill="#5eead4" text-anchor="middle">12 Jurisdictions</text>

    <!-- Pill 4 -->
    <rect x="486" y="468" width="120" height="30" rx="4" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-opacity="0.25" stroke-width="0.8"/>
    <text x="546" y="487" fill="#a5b4fc" text-anchor="middle">AWS Bedrock</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="560" width="1200" height="70" fill="#09090b" fill-opacity="0.6"/>
  <line x1="0" y1="560" x2="1200" y2="560" stroke="#27272a" stroke-width="0.5"/>

  <!-- URL -->
  <text x="80" y="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#71717a" letter-spacing="0.5">legal.org.ua</text>

  <!-- Bottom links -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52525b" letter-spacing="0.5">
    <text x="620" y="600">Blog</text>
    <circle cx="660" cy="597" r="1.5" fill="#3f3f46"/>
    <text x="675" y="600">Pitch Deck</text>
    <circle cx="750" cy="597" r="1.5" fill="#3f3f46"/>
    <text x="765" y="600">Investors</text>
    <circle cx="830" cy="597" r="1.5" fill="#3f3f46"/>
    <text x="845" y="600">News</text>
    <circle cx="885" cy="597" r="1.5" fill="#3f3f46"/>
    <text x="900" y="600">API Docs</text>
  </g>

  <!-- Powered by badge -->
  <rect x="1020" y="585" width="100" height="24" rx="4" fill="#18181b" stroke="#27272a" stroke-width="0.5"/>
  <text x="1070" y="601" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" fill="#52525b" text-anchor="middle" letter-spacing="1">BUILT ON AWS</text>
</svg>
