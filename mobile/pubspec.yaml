name: secondlayer_mobile
description: "SecondLayer - Ukrainian legal tech platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.0

  # Network
  dio: ^5.7.0
  http: ^1.2.2

  # Auth
  google_sign_in: ^6.2.2
  flutter_secure_storage: ^9.2.2
  app_links: ^6.3.4

  # Local storage
  hive_flutter: ^1.1.0

  # UI
  flutter_markdown: ^0.7.4
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.8
  google_fonts: ^6.0.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.0
  flutter_pdfview: ^1.3.2

  # Utils
  intl: ^0.20.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  file_picker: ^8.1.6
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  flutter_dotenv: ^5.2.1
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.1
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/images/
