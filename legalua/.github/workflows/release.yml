name: Release legalua CLI

on:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: bun-darwin-arm64
            asset: legal-darwin-arm64
          - os: macos-13
            target: bun-darwin-x64
            asset: legal-darwin-x64
          - os: ubuntu-latest
            target: bun-linux-x64
            asset: legal-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: legalua
        run: bun install

      - name: Build binary
        working-directory: legalua
        run: bun build ./src/cli.ts --compile --target=${{ matrix.target }} --outfile=${{ matrix.asset }}

      - name: Package
        working-directory: legalua
        run: tar czf ${{ matrix.asset }}.tar.gz ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: legalua/${{ matrix.asset }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.tar.gz'
          generate_release_notes: true

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Build
        working-directory: legalua
        run: |
          npm install
          npm run build

      - name: Publish
        working-directory: legalua
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-deb:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: legal-linux-x64
          path: legalua/bin/

      - name: Extract binary
        working-directory: legalua
        run: |
          cd bin && tar xzf legal-linux-x64.tar.gz
          mv legal-linux-x64 legal-linux-x64-bin
          mv legal-linux-x64-bin legal-linux-x64

      - name: Build .deb
        working-directory: legalua
        run: |
          mkdir -p bin
          cp bin/legal-linux-x64 bin/legal-linux-x64
          chmod +x scripts/build-deb.sh
          bash scripts/build-deb.sh ${GITHUB_REF_NAME#cli-v}

      - name: Upload .deb to release
        uses: softprops/action-gh-release@v2
        with:
          files: legalua/*.deb
