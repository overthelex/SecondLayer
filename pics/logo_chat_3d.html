<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lex — 3D Logo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      overflow: hidden;
    }
    .scene {
      perspective: 1400px;
      width: 320px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: spin var(--spin-duration, 12s) linear infinite;
    }
    @keyframes spin {
      from { transform: rotateY(0deg); }
      to { transform: rotateY(360deg); }
    }
    .face, .slice {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 95%;
      height: 95%;
      margin: -47.5% 0 0 -47.5%;
      transform-style: preserve-3d;
      pointer-events: none;
    }
    .face { backface-visibility: visible; }
    .face svg, .slice svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="logo" id="logo"></div>
  </div>
  <script>
    (function() {
      var m = /[?&]duration=(\d+(?:\.\d+)?)/.exec(location.search);
      if (m) document.getElementById('logo').style.setProperty('--spin-duration', m[1] + 's');
    })();
  </script>
  <script>
    (function() {
      var depth = 2;
      var half = depth / 2;
      var edgeColor = '#1E2838';
      var pathL = 'M2647 7105 c-170 -50 -322 -140 -454 -268 -182 -176 -310 -434 -327 -657 -3 -36 -8 -628 -11 -1316 -6 -1333 -5 -1394 41 -1574 89 -353 424 -690 784 -789 41 -12 121 -25 179 -31 106 -9 2806 -22 2854 -13 26 5 62 -49 -554 829 l-78 112 -948 7 c-881 7 -952 9 -1008 26 -159 49 -286 185 -330 354 -13 52 -15 259 -15 1702 l0 1643 -27 -1 c-16 0 -63 -11 -106 -24z';
      var pathX1 = 'M3340 6983 c56 -82 146 -211 200 -288 54 -77 136 -194 182 -260 47 -66 149 -212 228 -325 79 -113 173 -248 210 -300 36 -52 106 -151 155 -220 49 -69 170 -240 268 -380 242 -344 333 -473 534 -755 93 -132 241 -341 328 -465 87 -124 215 -306 285 -405 128 -181 169 -239 453 -640 86 -121 198 -280 249 -352 l93 -133 593 0 c325 0 592 3 592 6 0 5 -94 139 -380 544 -92 129 -243 343 -337 475 -93 132 -217 308 -275 390 -100 144 -208 296 -528 745 -81 113 -245 345 -365 515 -295 419 -386 548 -540 765 -72 102 -176 248 -230 325 -54 77 -124 176 -155 220 -31 44 -121 172 -200 285 -79 113 -174 249 -212 303 l-69 97 -590 0 -590 0 101 -147z';
      var pathX2 = 'M6489 7013 c-45 -65 -120 -174 -167 -243 -92 -135 -341 -496 -484 -702 -48 -70 -88 -130 -88 -133 0 -2 87 -130 193 -282 106 -153 241 -346 299 -430 l105 -151 89 131 c193 284 264 389 380 557 66 96 174 254 239 350 65 96 151 222 190 280 39 58 138 204 220 325 82 121 173 256 203 300 30 44 58 88 63 98 9 16 -21 17 -575 17 l-584 0 -83 -117z';
      var groupTransform = 'translate(0,960) scale(0.1,-0.1)';
      var logo = document.getElementById('logo');

      function makeFace(z, colorL, colorX) {
        var div = document.createElement('div');
        div.className = 'face';
        div.style.transform = 'translateZ(' + z + 'px)';
        var svg = '<svg viewBox="0 0 960 960" xmlns="http://www.w3.org/2000/svg"><g transform="' + groupTransform + '" stroke="none">' +
          '<path fill="' + colorL + '" d="' + pathL + '"/>' +
          '<path fill="' + colorX + '" d="' + pathX1 + '"/>' +
          '<path fill="' + colorX + '" d="' + pathX2 + '"/>' +
          '</g></svg>';
        div.innerHTML = svg;
        return div;
      }

      function makeSlice(z) {
        var div = document.createElement('div');
        div.className = 'slice';
        div.style.transform = 'translateZ(' + z + 'px)';
        var svg = '<svg viewBox="0 0 960 960" xmlns="http://www.w3.org/2000/svg"><g transform="' + groupTransform + '" stroke="none">' +
          '<path fill="' + edgeColor + '" d="' + pathL + '"/>' +
          '<path fill="' + edgeColor + '" d="' + pathX1 + '"/>' +
          '<path fill="' + edgeColor + '" d="' + pathX2 + '"/>' +
          '</g></svg>';
        div.innerHTML = svg;
        return div;
      }

      var numEdgeSlices = 8;
      var step = depth / (numEdgeSlices + 1);
      logo.appendChild(makeFace(-half, '#1E2838', '#5C7C9E'));
      for (var i = 1; i <= numEdgeSlices; i++) {
        logo.appendChild(makeSlice(-half + i * step));
      }
      logo.appendChild(makeFace(half, '#1E2838', '#5C7C9E'));
    })();
  </script>
</body>
</html>
