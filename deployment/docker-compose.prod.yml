services:
  postgres-prod:
    image: postgres:15-alpine
    container_name: secondlayer-postgres-prod
    command: >-
      postgres
      -c max_connections=300
      -c shared_buffers=16GB
      -c effective_cache_size=48GB
      -c work_mem=256MB
      -c maintenance_work_mem=4GB
      -c wal_buffers=64MB
      -c max_wal_size=8GB
      -c min_wal_size=2GB
      -c checkpoint_timeout=600
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_parallel_workers_per_gather=6
      -c max_parallel_maintenance_workers=8
      -c idle_in_transaction_session_timeout=60000
      -c statement_timeout=600000
      -c lock_timeout=30000
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secondlayer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-secondlayer_prod}
      TZ: Europe/Kiev
    ports:
    - "127.0.0.1:5438:5432"
    shm_size: '16g'
    volumes:
    - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-secondlayer} -d ${POSTGRES_DB:-secondlayer_prod}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
    - secondlayer-prod-network
    deploy:
      resources:
        limits:
          cpus: "6"
          memory: 24G
        reservations:
          memory: 8G

  pgbouncer-prod:
    image: edoburu/pgbouncer:v1.24.0-p1
    container_name: secondlayer-pgbouncer-prod
    ports:
    - "127.0.0.1:5439:5432"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-secondlayer}:${POSTGRES_PASSWORD:-}@postgres-prod:5432/${POSTGRES_DB:-secondlayer_prod}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 50
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 10
      RESERVE_POOL_TIMEOUT: 5
      SERVER_ROUND_ROBIN: 1
      TZ: Europe/Kiev
    depends_on:
      postgres-prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${POSTGRES_USER:-secondlayer} -d ${POSTGRES_DB:-secondlayer_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
    - secondlayer-prod-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  rada-db-init-prod:
    image: postgres:15-alpine
    container_name: rada-db-init-prod
    depends_on:
      postgres-prod:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres-prod
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-secondlayer_prod}
      POSTGRES_USER: ${POSTGRES_USER:-secondlayer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      RADA_POSTGRES_USER: ${RADA_POSTGRES_USER:-rada_mcp}
      RADA_POSTGRES_PASSWORD: ${RADA_POSTGRES_PASSWORD:-}
      RADA_POSTGRES_SCHEMA: ${RADA_POSTGRES_SCHEMA:-rada}
      TZ: Europe/Kiev
    volumes:
      - ./scripts/rada-db-init.sh:/scripts/rada-db-init.sh:ro
    command: ["sh", "/scripts/rada-db-init.sh"]
    restart: "no"
    networks:
      - secondlayer-prod-network

  postgres-openreyestr-prod:
    image: mcvovkes/openreyestr-db:latest
    container_name: openreyestr-postgres-prod
    shm_size: '2g'
    command: >-
      postgres
      -c max_connections=100
      -c shared_buffers=2GB
      -c effective_cache_size=4GB
      -c work_mem=64MB
      -c maintenance_work_mem=512MB
      -c wal_buffers=32MB
      -c idle_in_transaction_session_timeout=60000
      -c statement_timeout=300000
      -c lock_timeout=30000
    environment:
      POSTGRES_USER: ${OPENREYESTR_POSTGRES_USER:-openreyestr}
      POSTGRES_PASSWORD: ${OPENREYESTR_POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${OPENREYESTR_POSTGRES_DB:-openreyestr_prod}
      TZ: Europe/Kiev
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - postgres_openreyestr_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OPENREYESTR_POSTGRES_USER:-openreyestr} -d ${OPENREYESTR_POSTGRES_DB:-openreyestr_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - secondlayer-prod-network
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G

  qdrant-prod:
    image: qdrant/qdrant:v1.17.0
    container_name: secondlayer-qdrant-prod
    ports:
    - "127.0.0.1:6339:6333"
    - "127.0.0.1:6340:6334"
    volumes:
    - qdrant_prod_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 600s
    restart: unless-stopped
    networks:
    - secondlayer-prod-network
    environment:
      TZ: Europe/Kiev
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      QDRANT__STORAGE__OPTIMIZERS__MEMMAP_THRESHOLD_KB: "20480"
    deploy:
      resources:
        limits:
          memory: 40G
        reservations:
          memory: 8G

  redis-prod:
    image: redis:7-alpine
    container_name: secondlayer-redis-prod
    ports:
    - "127.0.0.1:6383:6379"
    volumes:
    - redis_prod_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 2048mb
      --maxmemory-policy volatile-lru
      --requirepass ${REDIS_PASSWORD}
      --rename-command CONFIG ""
      --rename-command DEBUG ""
      --rename-command SLAVEOF ""
      --rename-command REPLICAOF ""
      --rename-command FLUSHDB ""
      --rename-command FLUSHALL ""
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -a
      - ${REDIS_PASSWORD}
      - ping
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
    - secondlayer-prod-network
    environment:
      TZ: Europe/Kiev
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  migrate-prod:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.mono-backend
    image: secondlayer-app-prod:latest
    container_name: secondlayer-migrate-prod
    depends_on:
      postgres-prod:
        condition: service_healthy
      redis-prod:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-secondlayer}:${POSTGRES_PASSWORD:-}@postgres-prod:5432/${POSTGRES_DB:-secondlayer_prod}
      POSTGRES_HOST: postgres-prod
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-secondlayer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-secondlayer_prod}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      TZ: Europe/Kiev
    working_dir: /app/mcp_backend
    command:
    - node
    - dist/migrations/migrate.js
    restart: 'no'
    networks:
    - secondlayer-prod-network

  seed-admin-prod:
    image: secondlayer-app-prod:latest
    container_name: secondlayer-seed-admin-prod
    depends_on:
      migrate-prod:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-secondlayer}:${POSTGRES_PASSWORD:-}@postgres-prod:5432/${POSTGRES_DB:-secondlayer_prod}
      POSTGRES_HOST: postgres-prod
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-secondlayer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-secondlayer_prod}
      ADMIN_USERS: ${ADMIN_USERS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      TZ: Europe/Kiev
    working_dir: /app/mcp_backend
    command: ["node", "dist/scripts/seed-admin-user.js"]
    restart: "no"
    networks:
      - secondlayer-prod-network

  rada-migrate-prod:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.mono-rada
    image: rada-mcp-prod:latest
    container_name: rada-mcp-migrate-prod
    depends_on:
      rada-db-init-prod:
        condition: service_completed_successfully
      redis-prod:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres-prod
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${RADA_POSTGRES_USER:-rada_mcp}
      POSTGRES_PASSWORD: ${RADA_POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-secondlayer_prod}
      POSTGRES_SCHEMA: ${RADA_POSTGRES_SCHEMA:-rada}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-prod:6379
      REDIS_HOST: redis-prod
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      TZ: Europe/Kiev
    command: ["node", "dist/migrations/migrate.js"]
    restart: "no"
    networks:
      - secondlayer-prod-network

  rada-mcp-app-prod:
    image: rada-mcp-prod:latest
    container_name: rada-mcp-app-prod
    command: ["node", "--max-old-space-size=1536", "dist/http-server.js"]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      rada-migrate-prod:
        condition: service_completed_successfully
      redis-prod:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      HTTP_PORT: 3001
      HTTP_HOST: 0.0.0.0
      POSTGRES_HOST: postgres-prod
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${RADA_POSTGRES_USER:-rada_mcp}
      POSTGRES_PASSWORD: ${RADA_POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-secondlayer_prod}
      POSTGRES_SCHEMA: ${RADA_POSTGRES_SCHEMA:-rada}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-prod:6379
      REDIS_HOST: redis-prod
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL_QUICK: ${OPENAI_MODEL_QUICK:-gpt-5-nano}
      OPENAI_MODEL_STANDARD: ${OPENAI_MODEL_STANDARD:-gpt-5-mini}
      OPENAI_MODEL_DEEP: ${OPENAI_MODEL_DEEP:-gpt-5.1}
      LLM_PROVIDER_STRATEGY: ${LLM_PROVIDER_STRATEGY:-task-aware}
      SECONDLAYER_URL: http://app-prod:3000
      SECONDLAYER_API_KEY: ${SECONDARY_LAYER_KEYS:-}
      RADA_API_KEYS: ${RADA_API_KEYS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://legal.org.ua}
      TZ: Europe/Kiev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health/ready', r => { let d=''; r.on('data', c => d+=c); r.on('end', () => { if (r.statusCode !== 200) { process.stderr.write(d); process.exit(1); } process.exit(0); }); }).on('error', e => { process.stderr.write(e.message); process.exit(1); });"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - secondlayer-prod-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  migrate-openreyestr-prod:
    image: openreyestr-app-prod:latest
    build:
      context: ..
      dockerfile: deployment/Dockerfile.mono-openreyestr
    container_name: openreyestr-migrate-prod
    depends_on:
      postgres-openreyestr-prod:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${OPENREYESTR_POSTGRES_USER:-openreyestr}:${OPENREYESTR_POSTGRES_PASSWORD:-}@postgres-openreyestr-prod:5432/${OPENREYESTR_POSTGRES_DB:-openreyestr_prod}
      POSTGRES_HOST: postgres-openreyestr-prod
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${OPENREYESTR_POSTGRES_USER:-openreyestr}
      POSTGRES_PASSWORD: ${OPENREYESTR_POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${OPENREYESTR_POSTGRES_DB:-openreyestr_prod}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      TZ: Europe/Kiev
    command: ["node", "dist/migrations/migrate.js"]
    restart: "no"
    networks:
      - secondlayer-prod-network

  app-openreyestr-prod:
    image: openreyestr-app-prod:latest
    container_name: openreyestr-app-prod
    command: ["node", "dist/http-server.js"]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      NODE_ENV: production
      HTTP_PORT: 3005
      HTTP_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${OPENREYESTR_POSTGRES_USER:-openreyestr}:${OPENREYESTR_POSTGRES_PASSWORD:-}@postgres-openreyestr-prod:5432/${OPENREYESTR_POSTGRES_DB:-openreyestr_prod}
      POSTGRES_HOST: postgres-openreyestr-prod
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${OPENREYESTR_POSTGRES_USER:-openreyestr}
      POSTGRES_PASSWORD: ${OPENREYESTR_POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${OPENREYESTR_POSTGRES_DB:-openreyestr_prod}
      OPENREYESTR_API_KEYS: ${OPENREYESTR_API_KEYS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL_QUICK: ${OPENAI_MODEL_QUICK:-gpt-5-nano}
      OPENAI_MODEL_STANDARD: ${OPENAI_MODEL_STANDARD:-gpt-5-mini}
      OPENAI_MODEL_DEEP: ${OPENAI_MODEL_DEEP:-gpt-5.1}
      SECONDLAYER_URL: http://app-prod:3000
      SECONDLAYER_API_KEY: ${SECONDARY_LAYER_KEYS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_OPTIONS: --max-old-space-size=1536
      TZ: Europe/Kiev
    depends_on:
      postgres-openreyestr-prod:
        condition: service_healthy
      migrate-openreyestr-prod:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3005/health/ready', r => { let d=''; r.on('data', c => d+=c); r.on('end', () => { if (r.statusCode !== 200) { process.stderr.write(d); process.exit(1); } process.exit(0); }); }).on('error', e => { process.stderr.write(e.message); process.exit(1); });"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - secondlayer-prod-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # Nextcloud - cloud file storage
  nextcloud-db-prod:
    image: postgres:15-alpine
    container_name: nextcloud-db-prod
    environment:
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME:-nextcloud}
      POSTGRES_USER: ${NEXTCLOUD_DB_USER:-nextcloud}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:-nextcloud_prod_pass}
    volumes:
      - nextcloud_db_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEXTCLOUD_DB_USER:-nextcloud}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    networks:
      - secondlayer-prod-network

  nextcloud-prod:
    image: nextcloud:29-apache
    container_name: nextcloud-prod
    environment:
      POSTGRES_HOST: nextcloud-db-prod
      POSTGRES_DB: ${NEXTCLOUD_DB_NAME:-nextcloud}
      POSTGRES_USER: ${NEXTCLOUD_DB_USER:-nextcloud}
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:-nextcloud_prod_pass}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_PASSWORD:-admin}
      NEXTCLOUD_TRUSTED_DOMAINS: "nextcloud-prod localhost legal.org.ua"
      OVERWRITEPROTOCOL: https
      OVERWRITEHOST: nextcloud.legal.org.ua
    ports:
      - "127.0.0.1:8890:80"
    volumes:
      - nextcloud_prod_data:/var/www/html
    depends_on:
      nextcloud-db-prod:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    networks:
      - secondlayer-prod-network

  minio-prod:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio-prod
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_PROMETHEUS_AUTH_TYPE: public
      TZ: Europe/Kiev
    ports:
      - "127.0.0.1:9006:9000"
      - "127.0.0.1:9007:9001"
    volumes:
      - minio_prod_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - secondlayer-prod-network

  app-prod:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.mono-backend
    image: secondlayer-app-prod:latest
    container_name: secondlayer-app-prod
    command:
    - node
    - --max-old-space-size=6144
    - dist/http-server.js
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    environment:
      NODE_ENV: production
      HTTP_PORT: ${HTTP_PORT:-3000}
      HTTP_HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-secondlayer}:${POSTGRES_PASSWORD:-}@pgbouncer-prod:5432/${POSTGRES_DB:-secondlayer_prod}
      POSTGRES_HOST: pgbouncer-prod
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-secondlayer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-secondlayer_prod}
      QDRANT_URL: http://qdrant-prod:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_EDRSR_URL: ${QDRANT_EDRSR_URL:-}
      QDRANT_EDRSR_API_KEY: ${QDRANT_EDRSR_API_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-prod:6379
      REDIS_HOST: redis-prod
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEY2: ${OPENAI_API_KEY2:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_MODEL_QUICK: ${OPENAI_MODEL_QUICK:-gpt-5-nano}
      OPENAI_MODEL_STANDARD: ${OPENAI_MODEL_STANDARD:-gpt-5-mini}
      OPENAI_MODEL_DEEP: ${OPENAI_MODEL_DEEP:-gpt-5.1}
      LLM_PROVIDER_STRATEGY: ${LLM_PROVIDER_STRATEGY:-bedrock-first}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      BEDROCK_MODEL_QUICK: ${BEDROCK_MODEL_QUICK:-eu.anthropic.claude-haiku-4-5-20251001-v1:0}
      BEDROCK_MODEL_STANDARD: ${BEDROCK_MODEL_STANDARD:-eu.anthropic.claude-sonnet-4-6}
      BEDROCK_MODEL_DEEP: ${BEDROCK_MODEL_DEEP:-eu.anthropic.claude-sonnet-4-6}
      BEDROCK_FALLBACK_MODEL_QUICK: ${BEDROCK_FALLBACK_MODEL_QUICK:-eu.amazon.nova-micro-v1:0}
      BEDROCK_FALLBACK_MODEL_STANDARD: ${BEDROCK_FALLBACK_MODEL_STANDARD:-eu.amazon.nova-pro-v1:0}
      BEDROCK_FALLBACK_MODEL_DEEP: ${BEDROCK_FALLBACK_MODEL_DEEP:-eu.amazon.nova-pro-v1:0}
      VOYAGEAI_API_KEY: ${VOYAGEAI_API_KEY:-}
      VOYAGEAI_API_KEY_2: ${VOYAGEAI_API_KEY_2:-}
      VOYAGEAI_EMBEDDING_MODEL: ${VOYAGEAI_EMBEDDING_MODEL:-voyage-multilingual-2}
      ZAKONONLINE_API_TOKEN: ${ZAKONONLINE_API_TOKEN:-}
      ZAKONONLINE_API_TOKEN2: ${ZAKONONLINE_API_TOKEN2:-}
      SECONDARY_LAYER_KEYS: ${SECONDARY_LAYER_KEYS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL_QUICK: ${ANTHROPIC_MODEL_QUICK:-claude-haiku-4-5-20251001}
      ANTHROPIC_MODEL_STANDARD: ${ANTHROPIC_MODEL_STANDARD:-claude-sonnet-4-5-20250929}
      ANTHROPIC_MODEL_DEEP: ${ANTHROPIC_MODEL_DEEP:-claude-sonnet-4-5-20250929}

      # Google Cloud Vision API (OCR)
      VISION_CREDENTIALS_PATH: /app/credentials/vision-credentials.json
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/vision-credentials.json

      # Document Service
      DOCUMENT_SERVICE_URL: http://document-service-prod:3002

      # Unified Gateway
      ENABLE_UNIFIED_GATEWAY: "true"
      RADA_MCP_URL: http://rada-mcp-app-prod:3001
      RADA_API_KEY: ${RADA_API_KEY:-}
      OPENREYESTR_MCP_URL: http://app-openreyestr-prod:3005
      OPENREYESTR_API_KEY: ${OPENREYESTR_API_KEY:-}

      # Stage access for db-compare
      STAGE_BACKEND_URL: ${STAGE_BACKEND_URL:-https://stage.legal.org.ua}
      STAGE_API_KEY: ${STAGE_API_KEY:-}

      # WebAuthn / FIDO2
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-legal.org.ua}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-SecondLayer Legal}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-https://legal.org.ua}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: https://legal.org.ua/auth/google/callback
      # Diia (Дія) Auth
      DIIA_BASE_URL: ${DIIA_BASE_URL:-https://api2.diia.gov.ua}
      DIIA_ACQUIRER_TOKEN: ${DIIA_ACQUIRER_TOKEN:-}
      DIIA_AUTH_ACQUIRER_TOKEN: ${DIIA_AUTH_ACQUIRER_TOKEN:-}
      FRONTEND_URL: https://legal.org.ua
      ALLOWED_ORIGINS: https://legal.org.ua,https://mcp.legal.org.ua,https://platform.legal.org.ua

      # Bulk scrape pipeline (AWS SQS + S3)
      BULK_SCRAPE_SQS_QUEUE_URL: ${BULK_SCRAPE_SQS_QUEUE_URL:-}
      BULK_SCRAPE_SQS_DLQ_URL: ${BULK_SCRAPE_SQS_DLQ_URL:-}
      BULK_SCRAPE_S3_BUCKET: ${BULK_SCRAPE_S3_BUCKET:-}

      # MinIO
      MINIO_ENDPOINT: minio-prod
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_URL: https://legal.org.ua/s3

      # Nextcloud (cloud file storage)
      NEXTCLOUD_URL: http://nextcloud-prod:80
      NEXTCLOUD_USER: ${NEXTCLOUD_USER:-admin}
      NEXTCLOUD_PASSWORD: ${NEXTCLOUD_PASSWORD:-admin}

      # Upload temp
      UPLOAD_TEMP_DIR: /app/data/uploads

      # Email
      SMTP_HOST: mail.lexapp.co.ua
      SMTP_PORT: "587"
      SMTP_SECURE: "false"
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: noreply@legal.org.ua
      EMAIL_FROM_NAME: SecondLayer Legal Platform

      # Prometheus
      PROMETHEUS_URL: http://prometheus-prod:9090

      # Payment gateways
      MOCK_PAYMENTS: "false"
      PUBLIC_URL: https://legal.org.ua
      MONOBANK_API_KEY: ${MONOBANK_API_KEY:-}
      MONOBANK_REDIRECT_URL: ${MONOBANK_REDIRECT_URL:-https://legal.org.ua}
      NOWPAYMENTS_API_KEY: ${NOWPAYMENTS_API_KEY:-}
      NOWPAYMENTS_IPN_SECRET: ${NOWPAYMENTS_IPN_SECRET:-}
      NOWPAYMENTS_PUBLIC_KEY: ${NOWPAYMENTS_PUBLIC_KEY:-}
      TURN_SERVER_URL: ${TURN_SERVER_URL:-}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-}
      STUN_SERVER_URL: ${STUN_SERVER_URL:-stun:stun.l.google.com:19302}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: Europe/Kiev
    ports:
    - "127.0.0.1:3007:3000"
    depends_on:
      pgbouncer-prod:
        condition: service_healthy
      qdrant-prod:
        condition: service_healthy
      redis-prod:
        condition: service_healthy
      migrate-prod:
        condition: service_completed_successfully
    volumes:
    - app_prod_data:/app/data
    - app_prod_logs:/app/mcp_backend/logs
    - ../vision-ocr-credentials.json:/app/credentials/vision-credentials.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health/ready', r => { let d=''; r.on('data', c => d+=c); r.on('end', () => { if (r.statusCode !== 200) { process.stderr.write(d); process.exit(1); } process.exit(0); }); }).on('error', e => { process.stderr.write(e.message); process.exit(1); });"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
    - secondlayer-prod-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 4G

