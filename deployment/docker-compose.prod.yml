      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health/ready', r => { let d=''; r.on('data', c => d+=c); r.on('end', () => { if (r.statusCode !== 200) { process.stderr.write(d); process.exit(1); } process.exit(0); }); }).on('error', e => { process.stderr.write(e.message); process.exit(1); });"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - secondlayer-prod-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  app-openreyestr-prod-green:
    image: openreyestr-app-prod:latest
    container_name: openreyestr-app-prod-green
    profiles: ["green"]
    command: ["node", "dist/http-server.js"]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      NODE_ENV: production
      HTTP_PORT: 3005
      HTTP_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${OPENREYESTR_POSTGRES_USER:-openreyestr}:${OPENREYESTR_POSTGRES_PASSWORD:-}@postgres-openreyestr-prod:5432/${OPENREYESTR_POSTGRES_DB:-openreyestr_prod}
      POSTGRES_HOST: postgres-openreyestr-prod
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${OPENREYESTR_POSTGRES_USER:-openreyestr}
      POSTGRES_PASSWORD: ${OPENREYESTR_POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${OPENREYESTR_POSTGRES_DB:-openreyestr_prod}
      OPENREYESTR_API_KEYS: ${OPENREYESTR_API_KEYS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL_QUICK: ${OPENAI_MODEL_QUICK:-gpt-5-nano}
      OPENAI_MODEL_STANDARD: ${OPENAI_MODEL_STANDARD:-gpt-5-mini}
      OPENAI_MODEL_DEEP: ${OPENAI_MODEL_DEEP:-gpt-5.1}
      SECONDLAYER_URL: http://app-prod-green:3000
      SECONDLAYER_API_KEY: ${SECONDARY_LAYER_KEYS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_OPTIONS: --max-old-space-size=1536
      TZ: Europe/Kiev
    depends_on:
      postgres-openreyestr-prod:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3005/health/ready', r => { let d=''; r.on('data', c => d+=c); r.on('end', () => { if (r.statusCode !== 200) { process.stderr.write(d); process.exit(1); } process.exit(0); }); }).on('error', e => { process.stderr.write(e.message); process.exit(1); });"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - secondlayer-prod-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  document-service-prod-green:
    image: document-service-prod:latest
    container_name: document-service-prod-green
    profiles: ["green"]
    command: ["node", "--max-old-space-size=2048", "--expose-gc", "dist/document-service.js"]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    depends_on:
      pgbouncer-prod:
        condition: service_healthy
      qdrant-prod:
        condition: service_started
      redis-prod:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DOCUMENT_SERVICE_PORT: 3002
      PORT: 3002
      HTTP_PORT: 3002
      HTTP_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-secondlayer}:${POSTGRES_PASSWORD:-}@pgbouncer-prod:5432/${POSTGRES_DB:-secondlayer_prod}
      POSTGRES_HOST: pgbouncer-prod
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-secondlayer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-secondlayer_prod}
      QDRANT_URL: http://qdrant-prod:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_EDRSR_URL: ${QDRANT_EDRSR_URL:-}
      QDRANT_EDRSR_API_KEY: ${QDRANT_EDRSR_API_KEY:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-prod:6379
      REDIS_HOST: redis-prod
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEY2: ${OPENAI_API_KEY2:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      VOYAGEAI_API_KEY: ${VOYAGEAI_API_KEY:-}
      VOYAGEAI_API_KEY_2: ${VOYAGEAI_API_KEY_2:-}
      VOYAGEAI_EMBEDDING_MODEL: ${VOYAGEAI_EMBEDDING_MODEL:-voyage-multilingual-2}
      OPENAI_MODEL_QUICK: ${OPENAI_MODEL_QUICK:-gpt-5-nano}
      OPENAI_MODEL_STANDARD: ${OPENAI_MODEL_STANDARD:-gpt-5-mini}
      OPENAI_MODEL_DEEP: ${OPENAI_MODEL_DEEP:-gpt-5.1}
      LLM_PROVIDER_STRATEGY: ${LLM_PROVIDER_STRATEGY:-bedrock-first}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      BEDROCK_MODEL_QUICK: ${BEDROCK_MODEL_QUICK:-eu.anthropic.claude-haiku-4-5-20251001-v1:0}
      BEDROCK_MODEL_STANDARD: ${BEDROCK_MODEL_STANDARD:-eu.anthropic.claude-sonnet-4-6}
      BEDROCK_MODEL_DEEP: ${BEDROCK_MODEL_DEEP:-eu.anthropic.claude-sonnet-4-6}
      BEDROCK_FALLBACK_MODEL_QUICK: ${BEDROCK_FALLBACK_MODEL_QUICK:-eu.amazon.nova-micro-v1:0}
      BEDROCK_FALLBACK_MODEL_STANDARD: ${BEDROCK_FALLBACK_MODEL_STANDARD:-eu.amazon.nova-pro-v1:0}
      BEDROCK_FALLBACK_MODEL_DEEP: ${BEDROCK_FALLBACK_MODEL_DEEP:-eu.amazon.nova-pro-v1:0}
      ZAKONONLINE_API_TOKEN: ${ZAKONONLINE_API_TOKEN:-}
      ZAKONONLINE_API_TOKEN2: ${ZAKONONLINE_API_TOKEN2:-}
      VISION_CREDENTIALS_PATH: /app/credentials/vision-credentials.json
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials/vision-credentials.json
      FULLTEXT_STRATEGY: scrape_only
      SCRAPE_MAX_CONCURRENT: "5"
      SCRAPE_MAX_QUEUE_DEPTH: "200"
      SCRAPE_SKIP_EMBEDDINGS: "true"
      SECONDARY_LAYER_KEYS: ${SECONDARY_LAYER_KEYS:-}
      JWT_SECRET: ${JWT_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://legal.org.ua}
      TZ: Europe/Kiev
    volumes:
      - ../vision-ocr-credentials.json:/app/credentials/vision-credentials.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3002/health/ready', r => { let d=''; r.on('data', c => d+=c); r.on('end', () => { if (r.statusCode !== 200) { process.stderr.write(d); process.exit(1); } process.exit(0); }); }).on('error', e => { process.stderr.write(e.message); process.exit(1); });"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - secondlayer-prod-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 3G
        reservations:
          cpus: '0.25'
          memory: 512M

  lexwebapp-prod-green:
    image: lexwebapp-prod:latest
    container_name: lexwebapp-prod-green
    profiles: ["green"]
    environment:
    - NODE_ENV=production
    - TZ=Europe/Kiev
    networks:
    - secondlayer-prod-network
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - sh
      - -c
      - wget --quiet --tries=1 --spider http://127.0.0.1/ || exit 1
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Minimal monitoring
  prometheus-prod:
    image: prom/prometheus:v2.48.0
    container_name: prometheus-prod
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus-prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_prod_data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"
    networks:
      - secondlayer-prod-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  postgres-exporter-backend:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter-backend-prod
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-secondlayer}:${POSTGRES_PASSWORD:-}@postgres-prod:5432/${POSTGRES_DB:-secondlayer_prod}?sslmode=disable"
    volumes:
      - ./postgres_exporter.yml:/etc/postgres_exporter.yml:ro
    networks:
      - secondlayer-prod-network
    restart: unless-stopped
    depends_on:
      postgres-prod:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  postgres-exporter-openreyestr:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres-exporter-openreyestr-prod
    environment:
      DATA_SOURCE_NAME: "postgresql://${OPENREYESTR_POSTGRES_USER:-openreyestr}:${OPENREYESTR_POSTGRES_PASSWORD:-}@postgres-openreyestr-prod:5432/${OPENREYESTR_POSTGRES_DB:-openreyestr_prod}?sslmode=disable"
    volumes:
      - ./postgres_exporter.yml:/etc/postgres_exporter.yml:ro
    networks:
      - secondlayer-prod-network
    restart: unless-stopped
    depends_on:
      postgres-openreyestr-prod:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  redis-exporter:
    image: oliver006/redis_exporter:v1.56.0
    container_name: redis-exporter-prod
    environment:
      REDIS_ADDR: "redis://redis-prod:6379"
    networks:
      - secondlayer-prod-network
    restart: unless-stopped
    depends_on:
      - redis-prod
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node-exporter-prod
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - '/:/host:ro,rslave'
    networks:
      - secondlayer-prod-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M

  grafana-prod:
    image: grafana/grafana:10.2.3
    container_name: grafana-prod
    environment:
      - GF_SERVER_ROOT_URL=https://grafana.legal.org.ua
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - PROMETHEUS_HOST=prometheus-prod
    volumes:
      - grafana_prod_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3101:3000"
    networks:
      - secondlayer-prod-network
    restart: unless-stopped
    depends_on:
      - prometheus-prod
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  cadvisor-prod:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor-prod
    privileged: true
    devices:
      - /dev/kmsg
    environment:
      - DOCKER_API_VERSION=1.44
    command:
      - '-docker_only=true'
      - '-housekeeping_interval=30s'
      - '-storage_duration=1m0s'
      - '-event_storage_age_limit=default=0'
      - '-event_storage_event_limit=default=0'
      - '-disable_metrics=cpu_topology,hugetlb,memory_numa,perf_event,referenced_memory,resctrl,sched,tcp,udp'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /etc/machine-id:/etc/machine-id:ro
    networks:
      - secondlayer-prod-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 64M

  # ==========================================
  # Coturn TURN server (WebRTC NAT traversal)
  # ==========================================
  coturn:
    image: coturn/coturn:4.6
    container_name: sl-coturn
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/turnserver.conf:ro
    command: ["-c", "/etc/turnserver.conf", "--static-auth-secret=${TURN_SHARED_SECRET}"]
    restart: unless-stopped

  # EDRSR Fulltext Worker — continuously fills missing fulltext from od.reyestr.court.gov.ua
  # Uses network_mode: host to bind to multiple source IPs for parallel downloads
  edrsr-fulltext-worker:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.edrsr-fulltext-worker
    image: edrsr-fulltext-worker:latest
    container_name: edrsr-fulltext-worker
    network_mode: host
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    environment:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5438
      POSTGRES_USER: ${POSTGRES_USER:-secondlayer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-secondlayer_prod}
      HEALTH_PORT: "3011"
      SOURCE_IPS: "172.31.29.20"
      PROXY_URLS: ""
      WORKERS_PER_IP: "50"
      CHUNK_SIZE: "3000"
      BATCH_INSERT_SIZE: "500"
      IDLE_SLEEP: "3600"
      YEAR_START: "2005"
      LOG_LEVEL: info
      TZ: Europe/Kiev
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3011/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          memory: 128M

  # OpenData Sync — cron scheduler for government data sources
  opendata-sync-prod:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.opendata-sync
    image: opendata-sync-prod:latest
    container_name: opendata-sync-prod
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      app-prod:
        condition: service_healthy
      app-openreyestr-prod:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BACKEND_URL: http://app-prod:3000
      BACKEND_API_KEY: ${SECONDARY_LAYER_KEYS:-}
      OPENREYESTR_URL: http://app-openreyestr-prod:3005
      OPENREYESTR_API_KEY: ${OPENREYESTR_API_KEYS:-}
      HEALTH_PORT: "3010"
      TZ: Europe/Kiev
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3010/health', r => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - secondlayer-prod-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

volumes:
  postgres_prod_data:
    driver: local
  postgres_openreyestr_prod_data:
    driver: local
  qdrant_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  app_prod_data:
    driver: local
  app_prod_logs:
    driver: local
  minio_prod_data:
    driver: local
  prometheus_prod_data:
    driver: local
  nginx_prod_logs:
    driver: local
  grafana_prod_data:
    driver: local
  nextcloud_prod_data:
    driver: local
  nextcloud_db_prod_data:
    driver: local

networks:
  secondlayer-prod-network:
    driver: bridge
