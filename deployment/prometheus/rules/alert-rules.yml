groups:
  - name: critical_alerts
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been unreachable for more than 1 minute."

      - alert: PgPoolExhausted
        expr: pg_pool_connections{state="waiting"} > 10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PG pool exhausted on {{ $labels.job }}"
          description: "{{ $labels.job }} has {{ $value }} waiting connections for 2+ minutes."

      - alert: RedisMemoryCritical
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.95
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Redis memory > 95%"
          description: "Redis memory usage is at {{ $value | humanizePercentage }}."

      - alert: RedisEvictedKeys
        expr: rate(redis_evicted_keys_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis evicting keys"
          description: "Redis is evicting keys due to memory pressure. Rate: {{ $value }}/s"

      - alert: PgCacheHitLow
        expr: (pg_stat_database_blks_hit + pg_stat_database_blks_read) > 0 and pg_stat_database_blks_hit / (pg_stat_database_blks_hit + pg_stat_database_blks_read) < 0.95
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL cache hit ratio < 95%"
          description: "PG cache hit ratio is {{ $value | humanizePercentage }}. Consider increasing shared_buffers."

  - name: warning_alerts
    rules:
      - alert: HighErrorRate
        expr: service:http_error_rate:ratio5m > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.job }}"
          description: "5xx error rate is {{ $value | humanizePercentage }} for 5+ minutes."

      - alert: HighLatency
        expr: service:http_request_duration:p95 > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P95 latency on {{ $labels.job }}"
          description: "P95 latency is {{ $value }}s for 5+ minutes."

      - alert: PgPoolHigh
        expr: pg:pool_utilization:ratio > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PG pool utilization > 80% on {{ $labels.job }}"
          description: "Pool utilization is {{ $value | humanizePercentage }}."

      - alert: PgIdleInTransaction
        expr: pg_stat_activity_count{state="idle in transaction"} > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High idle in transaction connections"
          description: "{{ $value }} connections are idle in transaction for 5+ minutes."

      - alert: UploadQueueHigh
        expr: upload_queue_depth > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Upload queue depth > 100"
          description: "Upload queue has {{ $value }} pending jobs for 10+ minutes."

      - alert: CostSpike
        expr: >
          cost:total_usd:rate1h > 3 * avg_over_time(cost:total_usd:rate1h[24h])
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Cost spike detected"
          description: "Hourly cost rate is 3x above 24h average."

      - alert: HighCpuIowait
        expr: avg(rate(node_cpu_seconds_total{mode="iowait"}[5m])) > 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU iowait"
          description: "CPU iowait is {{ $value | humanizePercentage }}. Check disk I/O."

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage > 80%"
          description: "System memory usage is {{ $value | humanizePercentage }}."

      - alert: HighEventLoopLag
        expr: nodejs_eventloop_lag_p99_seconds > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High event loop lag on {{ $labels.job }}"
          description: "P99 event loop lag is {{ $value }}s for 5+ minutes. Check for blocking operations."

      - alert: HeapMemoryHigh
        expr: nodejs_heap_size_used_bytes / nodejs_heap_size_total_bytes > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Node.js heap usage > 90% on {{ $labels.job }}"
          description: "Heap utilization is {{ $value | humanizePercentage }}. Possible memory leak."

  - name: chat_quality_alerts
    rules:
      - alert: ChatToolThrashingHigh
        expr: histogram_quantile(0.95, sum(rate(chat_tool_repeat_max_bucket[10m])) by (le)) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Chat tool thrashing (repeat-max p95 > 5)"
          description: "P95 max-repeats-on-a-single-tool is {{ $value }} for 10+ minutes. Model is looping on one tool; check tool-loop stop logic / safety caps."

      - alert: ChatCapHitsHigh
        expr: >
          sum(rate(chat_cap_hit_requests_total{kind="any"}[10m])) / sum(rate(chat_tool_calls_per_request_count[10m])) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Chat truncated requests > 20%"
          description: "{{ $value | humanizePercentage }} of chat requests hit a safety cap (repeat/total) for 10+ minutes. Many requests are being truncated mid-loop."

      - alert: ChatAgenticIterationsHigh
        expr: histogram_quantile(0.95, sum(rate(chat_agentic_iterations_bucket[10m])) by (le)) > 16
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Chat agentic iterations p95 > 16"
          description: "P95 agentic-loop iterations is {{ $value }} for 10+ minutes. Possible runaway / non-converging reasoning loops."

      - alert: ChatGroundingScoreLow
        expr: histogram_quantile(0.5, sum(rate(chat_grounding_score_bucket[10m])) by (le)) < 70
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Chat grounding score p50 < 70"
          description: "Median grounding score is {{ $value }} (target >= 85) for 15+ minutes. More fabricated/ungrounded citations than usual."
