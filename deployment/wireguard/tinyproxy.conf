# tinyproxy config for developer machine (local.legal.org.ua)
# Install: sudo apt-get install -y tinyproxy
#          sudo cp tinyproxy.conf /etc/tinyproxy/tinyproxy.conf
#          sudo systemctl enable --now tinyproxy
#
# Systemd override to start after WireGuard:
#   sudo mkdir -p /etc/systemd/system/tinyproxy.service.d/
#   echo -e "[Unit]\nAfter=wg-quick@wg1.service" | sudo tee /etc/systemd/system/tinyproxy.service.d/after-wg.conf
#   sudo systemctl daemon-reload

User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 600
DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
LogLevel Info
LogFile "/var/log/tinyproxy/tinyproxy.log"
MaxClients 100
# Allow local and WireGuard subnet
Allow 127.0.0.1
Allow 10.149.22.0/24
Allow 172.18.0.0/16
ViaProxyName "tinyproxy"
