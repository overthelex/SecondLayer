# Coturn TURN server configuration
listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=${TURN_SHARED_SECRET}
realm=secondlayer.legal
total-quota=100
max-bps=10000000
stale-nonce=600
no-multicast-peers
no-cli
# Logging
log-file=stdout
new-log-timestamp
verbose
