# Nginx Configuration for legal.org.ua (Production)
# Runs as a Docker container (nginx-prod) in docker-compose.prod.yml

# App upstreams — managed by deploy script (blue-green switching)
include /etc/nginx/includes/prod-upstreams.conf;

# Static upstreams
upstream prod_plane {
    server 172.18.0.1:8282;
    keepalive 16;
}

# HTTP - plane.legal.org.ua (Plane project management)
server {
    listen 80;
    listen [::]:80;
    server_name plane.legal.org.ua;

    set_real_ip_from 172.31.0.0/16;
    real_ip_header X-Forwarded-For;

    # Direct access without ALB → redirect to HTTPS
    if ($http_x_forwarded_proto = "") {
        return 301 https://$host$request_uri;
    }

    # Behind ALB → proxy to Plane
    location / {
        proxy_pass http://prod_plane;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        client_max_body_size 100m;
    }
}

# HTTP - serve behind ALB or redirect to HTTPS for direct access
server {
    listen 80;
    listen [::]:80;
    server_name legal.org.ua mcp.legal.org.ua;

    # Real IP from ALB
    set_real_ip_from 172.31.0.0/16;
    real_ip_header X-Forwarded-For;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Direct access without ALB → redirect to HTTPS (health checks exempt)
    set $redirect_https "";
    if ($http_x_forwarded_proto = "") {
        set $redirect_https "1";
    }
    if ($request_uri ~ "^/health") {
        set $redirect_https "";
    }
    if ($redirect_https) {
        return 301 https://$host$request_uri;
    }

    # Behind ALB (X-Forwarded-Proto present) → serve content
    include /etc/nginx/includes/prod-server-common.conf;
}

# HTTPS - legal.org.ua (main production)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name legal.org.ua;

    ssl_certificate /etc/letsencrypt/live/legal.org.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legal.org.ua/privkey.pem;

    include /etc/nginx/includes/ssl-common.conf;
    include /etc/nginx/includes/prod-server-common.conf;
}

# HTTPS - plane.legal.org.ua (Plane project management)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name plane.legal.org.ua;

    ssl_certificate /etc/letsencrypt/live/legal.org.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legal.org.ua/privkey.pem;

    include /etc/nginx/includes/ssl-common.conf;

    location / {
        proxy_pass http://prod_plane;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        client_max_body_size 100m;
    }
}

# HTTPS - mcp.legal.org.ua (MCP endpoints)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcp.legal.org.ua;

    ssl_certificate /etc/letsencrypt/live/legal.org.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legal.org.ua/privkey.pem;

    include /etc/nginx/includes/ssl-common.conf;
    include /etc/nginx/includes/prod-server-common.conf;
}

# WebSocket upgrade map
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Preserve X-Forwarded-Proto from ALB; fall back to $scheme for direct access
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
