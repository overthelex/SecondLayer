# Nginx Configuration for legal.org.ua (Production)
# Runs as a Docker container (nginx-prod) in docker-compose.prod.yml

# Rate limiting zones (must be in http context, before server blocks)
# Use X-Forwarded-For from Cloudflare/ALB as real client IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=sse_conn_limit:10m;

# App upstreams — managed by deploy script (blue-green switching)
include /etc/nginx/includes/prod-upstreams.conf;

# Preview upstreams — managed by deploy script (points to inactive color)
include /etc/nginx/includes/preview-upstreams.conf;

# Static upstreams
upstream prod_platform {
    server platform-prod:80;
    keepalive 16;
}

upstream prod_plane {
    server 172.18.0.1:8282;
    keepalive 16;
}

# HTTP - plane.legal.org.ua (Plane project management)
server {
    listen 80;
    listen [::]:80;
    server_name plane.legal.org.ua;

    set_real_ip_from 172.31.0.0/16;
    real_ip_header X-Forwarded-For;

    # Direct access without ALB → redirect to HTTPS
    if ($http_x_forwarded_proto = "") {
        return 301 https://$host$request_uri;
    }

    # Behind ALB → proxy to Plane
    location / {
        proxy_pass http://prod_plane;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        client_max_body_size 100m;
    }
}

# HTTP - platform.legal.org.ua (Developer Console)
server {
    listen 80;
    listen [::]:80;
    server_name platform.legal.org.ua;

    set_real_ip_from 172.31.0.0/16;
    real_ip_header X-Forwarded-For;

    # Direct access without ALB → redirect to HTTPS
    if ($http_x_forwarded_proto = "") {
        return 301 https://$host$request_uri;
    }

    # Behind ALB → proxy auth/api to backend, everything else to platform frontend
    location /auth {
        proxy_pass http://prod_mcp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_http_version 1.1;
    }

    location /api {
        proxy_pass http://prod_mcp_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_http_version 1.1;
        client_max_body_size 50m;
    }

    location / {
        proxy_pass http://prod_platform;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_http_version 1.1;
    }
}

# HTTP - www.legal.org.ua → non-www redirect
server {
    listen 80;
    listen [::]:80;
    server_name www.legal.org.ua;

    set_real_ip_from 172.31.0.0/16;
    real_ip_header X-Forwarded-For;

    return 301 https://legal.org.ua$request_uri;
}

# HTTP - serve behind ALB or redirect to HTTPS for direct access
server {
    listen 80;
    listen [::]:80;
    server_name legal.org.ua mcp.legal.org.ua;

    # Real IP from ALB
    set_real_ip_from 172.31.0.0/16;
    real_ip_header X-Forwarded-For;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Direct access without ALB → redirect to HTTPS
    if ($http_x_forwarded_proto = "") {
        return 301 https://$host$request_uri;
    }

    # Behind ALB (X-Forwarded-Proto present) → serve content
    include /etc/nginx/includes/prod-server-common.conf;
}

# HTTPS - www.legal.org.ua → non-www redirect
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.legal.org.ua;

    ssl_certificate /etc/letsencrypt/live/legal.org.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legal.org.ua/privkey.pem;

    include /etc/nginx/includes/ssl-common.conf;

    return 301 https://legal.org.ua$request_uri;
}

