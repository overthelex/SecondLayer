# HTTP - nextcloud.legal.org.ua (Nextcloud file storage)
server {
    listen 80;
    listen [::]:80;
    server_name nextcloud.legal.org.ua;

    set_real_ip_from 172.31.0.0/16;
    real_ip_header X-Forwarded-For;

    # Direct access without ALB → redirect to HTTPS
    if ($http_x_forwarded_proto = "") {
        return 301 https://$host$request_uri;
    }

    # Behind ALB → proxy to Nextcloud
    location / {
        proxy_pass http://nextcloud-prod:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        client_max_body_size 512M;
    }
}

# HTTPS - nextcloud.legal.org.ua (Nextcloud — direct access)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nextcloud.legal.org.ua;

    ssl_certificate /etc/letsencrypt/live/legal.org.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legal.org.ua/privkey.pem;

    include /etc/nginx/includes/ssl-common.conf;

    location / {
        proxy_pass http://nextcloud-prod:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        client_max_body_size 512M;
    }
}

# HTTP - opendata.legal.org.ua (LEX AI LLC company landing — static HTML)
server {
    listen 80;
    listen [::]:80;
    server_name opendata.legal.org.ua;

    set_real_ip_from 172.31.0.0/16;
    real_ip_header X-Forwarded-For;

    # Direct access without ALB -> redirect to HTTPS
    if ($http_x_forwarded_proto = "") {
        return 301 https://$host$request_uri;
    }

    root /var/www/opendata;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(png|svg|jpg|ico|css|js)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# HTTPS - opendata.legal.org.ua (direct access)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name opendata.legal.org.ua;

    ssl_certificate /etc/letsencrypt/live/legal.org.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legal.org.ua/privkey.pem;

    include /etc/nginx/includes/ssl-common.conf;

    root /var/www/opendata;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(png|svg|jpg|ico|css|js)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

