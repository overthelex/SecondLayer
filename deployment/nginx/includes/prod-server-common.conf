# ==========================================
# Nextcloud (cloud file storage)
# ==========================================

location ^~ /nextcloud/ {
    proxy_pass http://nextcloud-prod:80/nextcloud/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";
    proxy_buffering off;
    client_max_body_size 512M;
}

# ==========================================
# MinIO S3 Proxy (presigned URLs)
# ==========================================

location ^~ /s3/ {
    proxy_pass http://minio-prod:9000/;
    proxy_http_version 1.1;
    proxy_set_header Host minio-prod:9000;
    proxy_set_header Connection "";
    proxy_buffering off;

    # S3 needs relaxed CSP for PDF viewer — keep core security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;

    # Hide MinIO Content-Disposition to allow inline PDF viewing
    proxy_hide_header Content-Disposition;
}

# ==========================================
# Block dotfiles (.env, .git, etc.) — prevent info leakage
# Must be before SPA fallback to avoid serving index.html for dotfile requests
# ==========================================

location ~ /\.(?!well-known) {
    return 404;
    access_log off;
    log_not_found off;
}

# ==========================================
# Static Assets (with caching)
# ==========================================

location ~* \.(mjs|js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    proxy_pass $prod_frontend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    expires 7d;
    include /etc/nginx/includes/security-headers.conf;
    add_header Cache-Control "public";
}

# ==========================================
# SPA Frontend (default fallback)
# ==========================================

location / {
    proxy_pass $prod_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";

    # Prevent caching index.html so browsers always get fresh chunk references after deploy
    include /etc/nginx/includes/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
}
