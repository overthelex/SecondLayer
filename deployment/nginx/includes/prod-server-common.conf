# Shared server block settings for production (legal.org.ua)

# Dynamic DNS resolution for Docker container hostnames
# Without this, nginx caches DNS at startup and breaks when containers restart
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# Backend hostname variables — using variables forces nginx to re-resolve DNS
# via resolver directive on each request (unlike static upstream blocks)
include /etc/nginx/includes/prod-backend-vars.conf;

# CORS origin validation for SSE endpoints
# Only allow known origins with credentials; MCP clients use Bearer tokens, not cookies
set $cors_origin "";
if ($http_origin ~* "^https://(legal\.org\.ua|stage\.legal\.org\.ua)$") {
    set $cors_origin $http_origin;
}

# Remove trailing slashes (SEO — canonical URLs without trailing slash)
# Safe pattern: if + return only, no proxy/rewrite inside if block
# Use $forwarded_proto (not $scheme) so redirects preserve HTTPS behind Cloudflare/ALB
if ($request_uri ~ ^(.+)/$) {
    return 301 $forwarded_proto://$host$1;
}

# Security Headers (server-level — apply to locations without their own add_header)
include /etc/nginx/includes/security-headers.conf;

# Logging
access_log /var/log/nginx/legal.org.ua-access.log;
error_log /var/log/nginx/legal.org.ua-error.log;

# Settings
client_max_body_size 50M;

# ==========================================
# Health Check (proxied to backend, works with blue-green)
# ==========================================

location /health {
    proxy_pass $prod_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    access_log off;
}

# ==========================================
# Authentication Routes
# ==========================================

location /auth {
    limit_req zone=auth_limit burst=10 nodelay;
    limit_req_status 429;

    proxy_pass $prod_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";
}

# ==========================================
# WebSocket - Admin Terminal
# ==========================================

location /api/admin/terminal {
    proxy_pass $prod_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Video call signaling WebSocket
location /api/ws/video-signaling {
    proxy_pass $prod_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# ==========================================
# MCP SSE API (versioned: /api/v1/sse)
# ==========================================

# GET /api/v1/sse  → establish SSE stream (rewrites to /v1/sse on backend)
# POST /api/v1/sse → route messages to SSE session (rewrites to /v1/sse on backend)
location /api/v1/sse {
    limit_conn sse_conn_limit 20;

    rewrite ^/api(/v1/sse.*)$ $1 break;
    proxy_pass $prod_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";

    # SSE specific
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_connect_timeout 75s;
    chunked_transfer_encoding on;

    include /etc/nginx/includes/security-headers.conf;
    add_header Access-Control-Allow-Origin "$cors_origin" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Cache-Control" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header X-Accel-Buffering "no";

    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin "$cors_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Cache-Control" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }
}

