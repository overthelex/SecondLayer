<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkedIn Banner — Attorney Marketplace</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #1a1a1a;
    font-family: 'Inter', sans-serif;
  }

  .banner {
    width: 1200px;
    height: 627px;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px 80px;
  }

  /* Subtle grid pattern */
  .banner::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* Accent glow */
  .glow-1 {
    position: absolute;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(214,107,70,0.15) 0%, transparent 70%);
    top: -100px;
    right: -100px;
  }

  .glow-2 {
    position: absolute;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(59,130,246,0.1) 0%, transparent 70%);
    bottom: -100px;
    left: -50px;
  }

  .content {
    position: relative;
    z-index: 2;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(214,107,70,0.15);
    border: 1px solid rgba(214,107,70,0.3);
    color: #e8956a;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 100px;
    margin-bottom: 32px;
  }

  .badge-dot {
    width: 6px;
    height: 6px;
    background: #d66b46;
    border-radius: 50%;
  }

  .title {
    color: #f1f5f9;
    font-size: 48px;
    font-weight: 800;
    line-height: 1.15;
    max-width: 750px;
    margin-bottom: 24px;
    letter-spacing: -0.02em;
  }

  .title span {
    color: #d66b46;
  }

  .subtitle {
    color: #94a3b8;
    font-size: 20px;
    font-weight: 400;
    line-height: 1.5;
    max-width: 650px;
    margin-bottom: 40px;
  }

  /* Flow steps */
  .flow {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .step {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 8px 16px;
    border-radius: 10px;
    color: #cbd5e1;
    font-size: 13px;
    font-weight: 500;
  }

  .step-icon {
    font-size: 16px;
  }

  .arrow {
    color: rgba(255,255,255,0.2);
    font-size: 18px;
  }

  /* Logo area */
  .logo-area {
    position: absolute;
    bottom: 50px;
    right: 80px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 2;
  }

  .logo-text {
    color: #64748b;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  .logo-text span {
    color: #d66b46;
  }

  .url {
    color: #475569;
    font-size: 13px;
    font-weight: 400;
  }

  /* Decorative elements */
  .deco-lines {
    position: absolute;
    top: 60px;
    right: 80px;
    z-index: 2;
  }

  .deco-line {
    width: 200px;
    height: 3px;
    margin-bottom: 6px;
    border-radius: 2px;
    opacity: 0.6;
  }

  .deco-line:nth-child(1) { background: #d66b46; width: 200px; }
  .deco-line:nth-child(2) { background: #3b82f6; width: 150px; }
  .deco-line:nth-child(3) { background: #d66b46; width: 100px; opacity: 0.3; }
</style>
</head>
<body>

<div class="banner">
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="deco-lines">
    <div class="deco-line"></div>
    <div class="deco-line"></div>
    <div class="deco-line"></div>
  </div>

  <div class="content">
    <div class="badge">
      <div class="badge-dot"></div>
      LegalTech · Build in Public
    </div>

    <h1 class="title">
      Attorney <span>Marketplace</span>:<br>
      From Bar Registry<br>
      to Escrow Payments
    </h1>

    <p class="subtitle">
      Verification → Onboarding → Search → Consultation → Chat → Payment
    </p>

    <div class="flow">
      <div class="step"><span class="step-icon">🔍</span> ERAU Verify</div>
      <span class="arrow">→</span>
      <div class="step"><span class="step-icon">👤</span> Onboard</div>
      <span class="arrow">→</span>
      <div class="step"><span class="step-icon">📋</span> Request</div>
      <span class="arrow">→</span>
      <div class="step"><span class="step-icon">💬</span> Real-time Chat</div>
      <span class="arrow">→</span>
      <div class="step"><span class="step-icon">💳</span> Escrow Pay</div>
    </div>
  </div>

  <div class="logo-area">
    <div>
      <div class="logo-text"><span>LEX</span> AI</div>
      <div class="url">legal.org.ua</div>
    </div>
  </div>
</div>

</body>
</html>
